    pairs.forEach(px=>{
      [-px, px].forEach(sx=>{
        tube(sx - 8, -344, 16, 74, M.metal, 2);
        ctx.fillStyle = '#0a0b0c';
        ctx.beginPath(); ctx.ellipse(sx, -340, 5, 3.6, 0, 0, 7); ctx.fill();
      });
    });
    ctx.fillStyle = M.metal[2];                       // 회전 하우징
    ctx.beginPath(); ctx.roundRect(-(T>=4?46:32), -290, (T>=4?92:64), 26, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = M.tint;
    for(let i=0;i<(T>=4?7:5);i++) ctx.fillRect(-(T>=4?40:26) + i*13, -284, 5, 14);
  }
  const barW = (!isRate && T >= 2) ? 17 : 13;         // 관통 계열은 대구경
  tube(-barW, -356, barW*2, 92, M.metal, 2);
  ctx.fillStyle = M.metal[2];
  ctx.beginPath(); ctx.roundRect(-19, -318, 38, 24, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fillRect(-17, -314, 6, 18);
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(-barW + 2, -356, 5, 92);
  ctx.fillStyle = 'rgba(0,0,0,.35)';       ctx.fillRect(barW - 6, -356, 5, 92);
  if(!isRate && T >= 4){                              // 파열 관통포 — 달아오른 코일
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<4;i++){
      const py = -344 + i*22;
      const cg = ctx.createRadialGradient(0, py, 1, 0, py, 26);
      cg.addColorStop(0, 'rgba(255,132,72,.5)'); cg.addColorStop(1, 'rgba(255,132,72,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, py, 26, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ff9a54';
    for(let i=0;i<4;i++) ctx.fillRect(-barW, -346 + i*22, barW*2, 3);
  }
  if(!isRate && T >= 3){                              // 양각대
    ctx.strokeStyle = M.metal[1]; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-6, -300); ctx.lineTo(-40, -238);
    ctx.moveTo( 6, -300); ctx.lineTo( 40, -238);
    ctx.stroke();
    ctx.fillStyle = M.metal[2];
    [-40, 40].forEach(sx=>{ ctx.beginPath(); ctx.ellipse(sx, -236, 9, 4, 0, 0, 7); ctx.fill(); });
  }

  /* ⑧ 총구장치 — 계열과 단계에 따라 커진다. 총구는 (0,-376) 고정 */
  const bw = (isRate && T >= 2) ? 24 : (!isRate && T >= 2) ? 21 : 17;
  tube(-bw, -382, bw*2, 34, M.metal, 4);
  if(isRate && T >= 2){
    ctx.fillStyle = 'rgba(0,0,0,.6)';                 // 제동기 포트
    [-20, 9].forEach(px=>{
      ctx.fillRect(px, -376, 11, 8); ctx.fillRect(px, -362, 11, 8);
    });
  }else if(!isRate && T >= 2){
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3;   // 단계식 제퇴기
    [-374, -364, -354].forEach(py=>{
      ctx.beginPath(); ctx.moveTo(-bw+3, py); ctx.lineTo(bw-3, py); ctx.stroke();
    });
  }else{
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.6;
    [-370, -360, -350].forEach(py=>{                  // 소염기 홈
      ctx.beginPath(); ctx.moveTo(-bw+2, py); ctx.lineTo(bw-2, py); ctx.stroke();
    });
  }
  ctx.fillStyle = '#08090a';                          // 총구 구멍
  ctx.beginPath(); ctx.ellipse(0, -374, 8, 6, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(0, -374, 8, 6, 0, 3.4, 6.1); ctx.stroke();

  /* ⑨ 가늠쇠 — 접히는 형태 */
  ctx.fillStyle = M.metal[1];
  poly([[-8,-386],[8,-386],[5,-394],[-5,-394]]);
  ctx.fillStyle = M.metal[0];
  poly([[-4,-394],[4,-394],[2.5,-418],[-2.5,-418]]);
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(-1, -416, 2, 20);

  /* ⑩ 조준경(1단계+) — 대물렌즈·접안렌즈·마운트 링 */
  if(T >= 1){
    tube(-19, -312, 38, 96, ['#26262a','#1a1a1d','#0f0f11'], 9);
    ctx.fillStyle = '#2e2e30';
    ctx.beginPath(); ctx.roundRect(-24, -304, 48, 14, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-24, -244, 48, 14, 3); ctx.fill();
    screw(-18, -297, 3); screw(18, -297, 3);
    screw(-18, -237, 3); screw(18, -237, 3);
    ctx.fillStyle = '#191a1c';                        // 조절 다이얼
    ctx.beginPath(); ctx.roundRect(17, -278, 13, 20, 3); ctx.fill();
    const lens = ctx.createRadialGradient(-5, -308, 2, 0, -305, 17);
    lens.addColorStop(0,   'rgba(176,232,255,.85)');
    lens.addColorStop(0.55,'rgba(58,132,164,.8)');
    lens.addColorStop(1,   'rgba(14,38,52,.95)');
    ctx.fillStyle = lens;
    ctx.beginPath(); ctx.ellipse(0, -306, 15, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, -306, 15, 8, 0, 0, 7); ctx.stroke();
  }
  /* ⑪ 레이저 모듈 — 관통 계열 3단계부터 */
  if(!isRate && T >= 3){
    tube(15, -268, 20, 44, ['#2c2c34','#202026','#141418'], 3);
    ctx.fillStyle = 'rgba(255,70,70,.95)';
    ctx.beginPath(); ctx.arc(25, -262, 4.5, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(25, -262, 1, 25, -262, 16);
    lg.addColorStop(0, 'rgba(255,60,60,.5)'); lg.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(25, -262, 16, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ⑫ 수직 손잡이 + 이걸 감아 쥔 왼손.
     예전엔 손등 타원 하나에 마디를 겹쳐 그려 뭉개져 있었다.
     손잡이를 먼저 세우고 손가락을 그 위로 감으면 잡은 모양이 읽힌다. */
  const fx = -30, fy = -214;
  tube(fx - 13, fy - 6, 26, 62, ['#3a332c','#282320','#151311'], 8);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  for(let i=0;i<4;i++) ctx.fillRect(fx - 10, fy + 4 + i*13, 20, 4);

  ctx.fillStyle = '#4a3a2e';                          // 손등
  ctx.beginPath(); ctx.ellipse(fx - 16, fy + 16, 21, 30, -0.2, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(fx - 22, fy + 24, 13, 20, -0.2, 0, 7); ctx.fill();
  for(let i=0;i<4;i++){                               // 손가락 — 손잡이를 감아 쥔다
    const fyy = fy - 2 + i*15;
    ctx.fillStyle = i % 2 ? '#5e4a3a' : '#54402f';
    ctx.beginPath(); ctx.roundRect(fx - 26, fyy, 40, 13, 6.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,220,.07)';
    ctx.beginPath(); ctx.roundRect(fx - 24, fyy + 1, 36, 4, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.28)';                // 마디 그늘
    ctx.fillRect(fx + 2, fyy + 2, 3, 9);
  }
  ctx.fillStyle = '#463628';                          // 엄지 — 반대쪽으로 넘어온다
  ctx.beginPath(); ctx.ellipse(fx + 14, fy + 6, 9, 19, 0.42, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,220,.06)';
  ctx.beginPath(); ctx.ellipse(fx + 12, fy - 1, 5, 11, 0.42, 0, 7); ctx.fill();
  ctx.fillStyle = '#33281e';                          // 장갑 손목
  ctx.beginPath(); ctx.roundRect(fx - 34, fy + 44, 40, 20, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,220,.05)';
  ctx.fillRect(fx - 32, fy + 46, 36, 4);

  /* ⑬ 총구 연기 — 쏜 직후 옅게 피어오른다 */
  if(g && g.flash > 0.02){
    const sm = g.flash;
    ctx.fillStyle = `rgba(196,192,180,${sm*0.10})`;
    for(let i=0;i<3;i++){
      const py = -BARREL - 16 - i*20 - (1-sm)*26;
      ctx.beginPath();
      ctx.ellipse(Math.sin(g.t*7 + i)*7*(1-sm+0.4), py, 11 + i*7, 8 + i*5, 0, 0, 7);
      ctx.fill();
    }
  }

  /* ⑭ 총구 화염 — 회전축 위 BARREL 지점, 즉 예광탄 시작점과 정확히 같은 자리.
     예전엔 반지름 150px 짜리 별이 화면 가운데를 다 태워서, 연사 중엔 좀비가
     안 보였다. 절반으로 줄이고 좌우를 살짝 비대칭으로 흔든다. */
  /* 화염은 조준점 바로 위에 뜬다 — 즉 지금 쏘고 있는 좀비를 정확히 가린다.
     연사 중엔 flash 가 0 까지 내려가지도 못하니 상시 가림막이 된다.
     크기와 밝기를 더 줄이고, 세로 화염을 짧게 눌러 시야를 비운다. */
  if(g && g.flash > 0.04){
    const f = g.flash, my = -BARREL;
    const wob = Math.sin(g.t * 61) * 0.16;                              // 발마다 다른 모양
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(0, my, 2, 0, my, 74*f);
    fg.addColorStop(0,   `rgba(255,248,214,${f*0.72})`);
    fg.addColorStop(0.32,`rgba(255,172,62,${f*0.34})`);
    fg.addColorStop(1,   'rgba(255,118,20,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, my, 74*f, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,236,180,${f*0.8})`;
    poly([[0, my - 34*f], [13*f, my + 3], [-13*f, my + 3]]);            // 세로 화염
    poly([[(-34 + wob*22)*f, my - 5], [0, my - 13*f],
          [( 34 + wob*22)*f, my - 5], [0, my + 8]]);                    // 가로 화염
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

/* 조준점.
   전투 중엔 반동만큼 벌어지는 십자선 + 재장전 링을,
   메뉴/강화 화면에선 UI 를 가리키는 포인터를 그린다. */
function drawCross(){
  const x = mouse.x, y = mouse.y;

  if(state !== 'playing'){                          // UI 포인터
    ctx.strokeStyle = 'rgba(231,225,208,.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y - 9); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 9); ctx.lineTo(x - 6, y);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(231,225,208,.95)';
    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill();
    return;
  }

  const reloading = g && g.reloadT > 0;
  const lowA = g && g.gun.ammo <= g.gun.mag*0.25;
  const sp   = 7 + (g ? g.recoil*10 : 0);           // 반동만큼 벌어진다
  const col  = g && g.hitMark > 0 ? '255,96,74'
             : reloading ? '224,179,63'
             : lowA ? '224,140,90' : '230,238,250';

  // 재장전 링 — 시선을 우하단으로 옮기지 않아도 진행이 보인다
  if(reloading){
    const p = 1 - g.reloadT / g.gun.reload;
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 25, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(224,179,63,.28)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 25, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(224,179,63,.95)'; ctx.lineWidth = 3; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(x, y, 25, -Math.PI/2, -Math.PI/2 + p*Math.PI*2); ctx.stroke();
  }

  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3.6;   // 밝은 배경에서도 보이게 외곽선
  for(let pass=0; pass<2; pass++){
    if(pass){ ctx.strokeStyle = `rgba(${col},.9)`; ctx.lineWidth = 1.6; }
    ctx.beginPath();
    ctx.moveTo(x - sp - 11, y); ctx.lineTo(x - sp, y);
    ctx.moveTo(x + sp, y);      ctx.lineTo(x + sp + 11, y);
    ctx.moveTo(x, y - sp - 11); ctx.lineTo(x, y - sp);
    ctx.moveTo(x, y + sp);      ctx.lineTo(x, y + sp + 11);
    ctx.stroke();
  }
  ctx.fillStyle = `rgba(${col},.95)`;
  ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill();

  if(g && g.hitMark > 0){                           // 명중 표식
    const a = g.hitMark / 0.18, r1 = 5 + (1-a)*4, r2 = 14 + (1-a)*7;
    ctx.strokeStyle = `rgba(255,96,74,${a})`; ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(x-r2,y-r2); ctx.lineTo(x-r1,y-r1); ctx.moveTo(x+r2,y-r2); ctx.lineTo(x+r1,y-r1);
    ctx.moveTo(x-r2,y+r2); ctx.lineTo(x-r1,y+r1); ctx.moveTo(x+r2,y+r2); ctx.lineTo(x+r1,y+r1);
    ctx.stroke();
  }
}

function drawHUD(){
  ctx.textBaseline = 'alphabetic';
  const barR = g.bar / g.barMax, hpR = g.hp / g.maxHp;

  /* ① 좌상단 — 진지 상태.
     예전엔 참호 붕괴 경고를 이 판 안에 그려서 게이지 라벨과 3px 차이로 겹쳤다.
     가장 급한 정보가 가장 뭉개지던 자리라 아래로 따로 뺐다. */
  plate(28, 24, 312, 108, barR <= 0 ? C.red : C.warn);
  row(46, 324, 52, '참호 내구도', Math.ceil(g.bar) + ' / ' + Math.round(g.barMax),
      C.dust, barR > 0.25 ? C.bone : C.red, 12);
  gauge(46, 58, 278, 13, barR,
        barR > 0.5 ? '#c9a34b' : barR > 0.25 ? '#d4762e' : C.red, g.barFx);
  row(46, 324, 96, '체력', Math.ceil(g.hp) + ' / ' + Math.round(g.maxHp),
      C.dust, hpR > 0.25 ? C.bone : C.red, 12);
  gauge(46, 102, 278, 13, hpR,
        hpR > 0.5 ? C.hp : hpR > 0.25 ? C.warn : C.red, g.hurtFx);

  if(barR <= 0){                                   // 참호가 무너진 상태 — 독립 배너
    const pulse = 0.5 + Math.sin(g.t*7)*0.5;
    plate(28, 140, 312, 28, C.red, `rgba(58,10,8,${0.62 + pulse*0.24})`);
    type(12, 700, 0.4); ctx.textAlign = 'left';
    ctx.fillStyle = `rgba(255,150,138,${0.62 + pulse*0.38})`;
    ctx.fillText('참호 붕괴 — 직접 피해를 받는 중', 46, 159);
  }

  /* ② 상단 중앙 — 웨이브. 게임의 시계라서 가장 큰 활자를 준다. */
  plate(W/2 - 156, 24, 312, 62);
  ctx.textAlign = 'center';
  type(11, 600, 3.2); ctx.fillStyle = C.faint; ctx.fillText('W A V E', W/2, 45);
  type(30, 800, 1);   ctx.fillStyle = C.bone;  ctx.fillText(String(g.wave), W/2, 74);
  type(11, 500, 0.2); ctx.fillStyle = C.faint;
  ctx.textAlign = 'left';  ctx.fillText('점수 ' + g.score, W/2 - 140, 74);
  ctx.textAlign = 'right'; ctx.fillText('처치 ' + g.kills, W/2 + 140, 74);
  type(10, 500, 0.2); ctx.textAlign = 'right';
  ctx.fillStyle = g.score > best ? C.warn : 'rgba(111,104,87,.75)';
  ctx.fillText(g.score > best ? '신기록' : '최고 ' + best, W/2 + 140, 45);

  /* ②-b 자금 — 좀비가 곧 돈이라 전투 중에도 계속 보여야 한다 */
  const cw = 176, cx0 = W/2 - cw/2;
  plate(cx0, 92, cw, 34, C.warn);
  type(10, 500, 1); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
  ctx.fillText('자금', cx0 + 14, 114);
  type(17, 800, 0); ctx.textAlign = 'right';
  ctx.fillStyle = g.cashFx > 0 ? `rgb(255,${224 - (30*(1-g.cashFx))|0},138)` : C.warn;
  ctx.fillText('₩' + g.cash, cx0 + cw - 14, 115);
  keycap(cx0 + cw + 10, 100, 'B', C.faint, 20, 18);
  type(9, 500, 0.4); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
  ctx.fillText('상점', cx0 + cw + 34, 114);

  /* ②-c 전방 방어선 — 몇 겹이 남았는지, 각 겹이 얼마나 버티는지 */
  if(g.works.length){
    const bx = cx0 - 128;
    type(9, 500, 0.6); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
    ctx.fillText('전방 방어선', bx, 102);
    g.works.forEach((wk, i)=>{
      const y = 108 + i*13, r = Math.max(0, wk.hp / wk.max);
      ctx.fillStyle = WORKS[wk.kind].col[0];
      ctx.fillRect(bx, y, 3, 8);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx + 6, y + 2, 70, 4);
      ctx.fillStyle = wk.fx > 0.1 ? '#ffd0a0' : r > 0.4 ? '#c9a34b' : C.red;
      ctx.fillRect(bx + 6, y + 2, 70 * r, 4);
      type(8, 700, 0.2); ctx.fillStyle = (wk.lv||1) > 1 ? C.hp : C.faint;
      ctx.fillText('★'.repeat(wk.lv || 1), bx + 80, y + 7);   // 등급
      type(8, 500, 0.2); ctx.fillStyle = C.faint;
      ctx.fillText(wk.d.toFixed(1) + 'm', bx + 100, y + 7);
    });
  }

  /* ③ 우상단 — 남은 좀비. 진행바는 다 죽일수록 비어간다. */
  const left  = g.queue.length + g.zombies.length;
  const total = Math.max(1, g.waveTotal || left);
  plate(W - 340, 24, 312, 62, C.red);
  type(11, 500, 0.3); ctx.textAlign = 'left';  ctx.fillStyle = C.dust;
  ctx.fillText('남은 좀비', W - 322, 48);
  type(26, 800, 0);   ctx.textAlign = 'right'; ctx.fillStyle = '#e0685a';
  ctx.fillText(String(left), W - 46, 52);
  gauge(W - 322, 62, 276, 8, Math.min(1, left/total), '#8a4038', 0);
  if(g.queue.length === 0 && left > 0){            // 더 안 나온다 = 마무리 국면
    type(10, 600, 0.6); ctx.textAlign = 'right'; ctx.fillStyle = C.warn;
    ctx.fillText('마지막 무리', W - 46, 78);
  }

  /* ④ 연속 처치 — 붕괴 배너와 겹치지 않는 우측에 */
  if(g.combo >= 3){
    const a = Math.min(1, g.comboT / 0.6);
    const pop = 1 + Math.max(0, (g.comboT - 2.0)) * 0.5;
    ctx.textAlign = 'right';
    type(Math.round(42*pop), 800, 0); ctx.fillStyle = `rgba(224,168,74,${a})`;
    ctx.fillText(String(g.combo), W - 46, 148);
    type(11, 600, 1.6); ctx.fillStyle = `rgba(167,157,132,${a*0.9})`;
    ctx.fillText('연속 처치', W - 46, 168);
  }

  /* ⑤ 좌하단 — 총기 스펙 + 두 트랙의 단계 */
  const SY = H - 146;
  plate(28, SY, 312, 112);
  // 계열이 갈리면 봐야 할 수치가 달라진다 — 연사 계열은 동시 발사, 관통 계열은 파열
  const stats = [
    ['데미지',  g.gun.dmg.toFixed(0)],
    ['연사',    g.gun.rate.toFixed(1)],
    ['관통',    String(1 + g.gun.pierce)],
    g.gun.shots > 1 ? ['동시', g.gun.shots + '발']
      : g.gun.boom > 0 ? ['파열', String(Math.round(g.gun.boom))]
      : ['치명타', Math.round(g.gun.crit*100) + '%'],
    ['치명타',  Math.round(g.gun.crit*100) + '%'],
  ];
  if(g.gun.shots <= 1 && g.gun.boom <= 0) stats.pop();   // 중복 제거
  ctx.textAlign = 'center';
  stats.forEach(([k, v], i)=>{
    const x = 46 + 28 + i*(stats.length > 4 ? 56 : 70);
    type(10, 500, 0.4);  ctx.fillStyle = C.faint; ctx.fillText(k, x, SY + 20);
    type(stats.length > 4 ? 15 : 17, 700, 0); ctx.fillStyle = C.bone; ctx.fillText(v, x, SY + 42);
    if(i < stats.length - 1){
      ctx.fillStyle = 'rgba(198,184,142,.13)';
      ctx.fillRect(x + (stats.length > 4 ? 28 : 35), SY + 12, 1, 32);
    }
  });
  ctx.fillStyle = 'rgba(198,184,142,.13)'; ctx.fillRect(46, SY + 56, 278, 1);
  const gcol = g.branch ? BRANCH[g.branch].col : C.gun;
  [[g.gunUps, gunName(),           gcol,  SY + 78,  GUN_STEP, 10, 5],
   [g.trUps,  TR_TIER[trTier(g.trUps)], C.tr, SY + 100, TR_STEP, 18, 6]]
   .forEach(([n, label, col, y, st, pw, gp])=>{
    ctx.fillStyle = col;                           // 트랙 표식
    ctx.beginPath(); ctx.roundRect(46, y - 8, 3, 9, 1.5); ctx.fill();
    type(12, 700, 0.2); ctx.textAlign = 'left'; ctx.fillStyle = col;
    ctx.fillText(label, 56, y);
    pips(258 - (st === 5 ? 16 : 0), y - 8, n % st, col, pw, 7, gp, st);
  });

  /* ⑥ 우하단 — 탄약. 남은 발이 탄창 스트립으로도 보인다. */
  const AY = H - 112, AX = W - 340;
  plate(AX, AY, 312, 78, g.gun.ammo <= g.gun.mag*0.25 && g.reloadT <= 0 ? C.red : null);
  if(g.reloadT > 0){
    const p = 1 - g.reloadT / g.gun.reload;
    type(11, 600, 0.6); ctx.textAlign = 'left'; ctx.fillStyle = C.warn;
    ctx.fillText('재장전', AX + 18, AY + 26);
    type(30, 800, 0); ctx.textAlign = 'right'; ctx.fillStyle = C.warn;
    ctx.fillText(Math.round(p*100) + '%', AX + 294, AY + 46);
    gauge(AX + 18, AY + 56, 276, 10, p, C.warn, 0);
  }else{
    const lowA = g.gun.ammo <= g.gun.mag*0.25;
    keycap(AX + 18, AY + 14, 'R', C.faint);
    type(11, 500, 0.3); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
    ctx.fillText('재장전', AX + 46, AY + 28);
    type(38, 800, 0); ctx.textAlign = 'right';
    ctx.fillStyle = lowA ? C.red : C.bone;
    ctx.fillText(String(g.gun.ammo), AX + 244, AY + 46);
    type(17, 500, 0); ctx.fillStyle = C.faint;
    ctx.fillText('/ ' + g.gun.mag, AX + 294, AY + 46);
    // 탄창 스트립 — 20발 이하면 한 칸이 한 발
    const sx = AX + 18, sw = 276;
    ctx.fillStyle = C.well; ctx.fillRect(sx, AY + 56, sw, 10);
    if(g.gun.mag <= 20){
      const cw2 = sw / g.gun.mag;
      for(let i=0;i<g.gun.ammo;i++){
        ctx.fillStyle = lowA ? C.red : '#c9a34b';
        ctx.fillRect(sx + i*cw2 + 1, AY + 58, cw2 - 2, 6);
      }
    }else{
      gauge(sx, AY + 56, sw, 10, g.gun.ammo / g.gun.mag, lowA ? C.red : '#c9a34b', 0);
    }
  }

  /* ⑦ 웨이브 배너 — 활자만 크게 띄우지 않고 띠로 받쳐서 읽히게.
     강화 피드백(drawUpFx)이 196~312 를 쓰므로, 그게 떠 있는 동안은 아래로 비킨다.
     예전 위치(158)는 연속 처치 숫자와 참호 붕괴 경고를 정면으로 덮었다. */
  if(g.waveTxt > 0){
    const a  = Math.min(1, g.waveTxt / 0.6);
    const bs = g.wave % 5 === 0;
    const BY = g.upFx ? 336 : 196;
    // 아래에서 올라와 자리를 잡는다. 위로 슬라이드하면 연속 처치 숫자를 덮는다.
    const slide = (1 - Math.min(1, (2.2 - g.waveTxt) / 0.35)) * 26;
    ctx.save();
    ctx.translate(0, slide);
    ctx.fillStyle = `rgba(8,9,7,${a*0.62})`; ctx.fillRect(0, BY, W, 96);
    ctx.fillStyle = bs ? `rgba(201,79,240,${a})` : `rgba(217,72,58,${a})`;
    ctx.fillRect(0, BY, W, 2); ctx.fillRect(0, BY + 94, W, 2);
    ctx.textAlign = 'center';
    type(56, 800, 6); ctx.fillStyle = `rgba(${bs ? '221,150,246' : '232,110,96'},${a})`;
    ctx.fillText('WAVE ' + g.wave, W/2, BY + 56);
    type(14, 500, 3.4); ctx.fillStyle = `rgba(167,157,132,${a*0.95})`;
    ctx.fillText(bs ? '보스가 온다' : '놈들이 온다', W/2, BY + 82);
    ctx.restore();
  }

  /* ⑧ 첫 웨이브에만 조작 안내 — HTML 로 띄우면 캔버스 밖에서 어긋난다 */
  if(g.tip > 0 && g.wave <= 1){
    const a = Math.min(1, g.tip / 1.6) * 0.8;
    ctx.textAlign = 'center'; type(12, 500, 1.4);
    ctx.fillStyle = `rgba(167,157,132,${a})`;
    ctx.fillText('마우스 조준  ·  클릭 유지로 연사  ·  R 재장전  ·  B 보급창', W/2, 300);
  }
}

/* 강화를 고른 직후 뜨는 피드백 — 단계가 오르면 훨씬 크게 */
function drawUpFx(){
  if(!g || !g.upFx) return;
  const f = g.upFx;
  const a = Math.min(1, f.life / (f.tierUp ? 0.9 : 0.5));
  const rgb = f.k === 'gun' ? '224,130,74' : '95,159,201';
  ctx.textAlign = 'center';

  if(f.tierUp){
    ctx.fillStyle = `rgba(${rgb},${a*0.11})`; ctx.fillRect(0, 0, W, H);
    // 위아래 띠
    ctx.fillStyle = `rgba(8,9,7,${a*0.76})`; ctx.fillRect(0, 196, W, 118);
    ctx.fillStyle = `rgba(${rgb},${a})`;
    ctx.fillRect(0, 196, W, 2); ctx.fillRect(0, 312, W, 2);
    type(12, 700, 4); ctx.fillStyle = `rgba(${rgb},${a})`;
    ctx.fillText(f.k === 'gun' ? '총기 단계 상승' : '참호 단계 상승', W/2, 230);
    type(42, 800, 1); ctx.fillStyle = `rgba(231,225,208,${a})`;
    ctx.fillText(f.label, W/2, 278);
    type(13, 500, 0.6); ctx.fillStyle = `rgba(167,157,132,${a})`;
    ctx.fillText(f.sub, W/2, 302);
  }else{
    type(25, 700, 0.4); ctx.fillStyle = `rgba(231,225,208,${a})`;
    ctx.fillText(f.label, W/2, 250);
    type(12, 600, 0.8); ctx.fillStyle = `rgba(${rgb},${a})`;
    ctx.fillText(f.sub, W/2, 274);
    const tot = f.total || 3;                      // 진행 칸 (총기 5 / 참호 3)
    for(let i=0;i<tot;i++){
      const x = W/2 - (tot*22 - 6)/2 + i*22;
      ctx.fillStyle = i < f.step ? `rgba(${rgb},${a})` : `rgba(198,184,142,${a*0.22})`;
      ctx.beginPath(); ctx.roundRect(x, 286, 16, 6, 2); ctx.fill();
    }
  }
}

/* 상점 칸의 사각형은 한 곳에서만 계산한다 —
   그리기와 클릭 판정이 어긋나면 호버는 켜지는데 클릭이 안 먹는 띠가 생긴다. */
/* 4열 3행 = 12칸. 진열 6 + 방어선 3 + 보급 2 를 한 화면에 다 올리려면
   3열로는 마지막 줄이 화면 밖으로 나간다. */
const CARD = {w: 286, h: 132, gx: 16, gy: 14, y: 196, cols: 4};
function cardRect(i){
  const col = i % CARD.cols, rowi = (i / CARD.cols) | 0;
  const x0 = W/2 - (CARD.w*CARD.cols + CARD.gx*(CARD.cols-1))/2;
  return {x: x0 + col*(CARD.w + CARD.gx), y: CARD.y + rowi*(CARD.h + CARD.gy),
          w: CARD.w, h: CARD.h};
}
function cardHover(i){
  const r = cardRect(i);
  return mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h;
}
const BTN_GO     = {x: W/2 + 156, y: 636, w: 200, h: 42};
const BTN_REROLL = {x: W/2 - 356, y: 636, w: 200, h: 42};
const inBtn = b => mouse.x > b.x && mouse.x < b.x+b.w && mouse.y > b.y && mouse.y < b.y+b.h;

/* ── 상점 화면 ─────────────────────────────────────────── */
function drawShop(){
  const sc = ctx.createLinearGradient(0, 0, 0, H);
  sc.addColorStop(0, 'rgba(6,8,9,.92)');
  sc.addColorStop(0.62, 'rgba(6,8,9,.86)');
  sc.addColorStop(1, 'rgba(6,8,9,.95)');
  ctx.fillStyle = sc; ctx.fillRect(0, 0, W, H);

  const cleared = !g.queue.length && !g.zombies.length;
  ctx.textAlign = 'center';
  type(11, 600, 4.4); ctx.fillStyle = cleared ? C.hp : C.warn;
  ctx.fillText(cleared ? 'W A V E   ' + g.wave + '   C L E A R' : '전 투 중 · 보 급', W/2, 62);
  type(32, 800, 0.5); ctx.fillStyle = C.bone;
  ctx.fillText('보급창', W/2, 102);

  // 보유 금액 — 이 화면의 주인공이라 크게
  const cashW = 300;
  plate(W/2 - cashW/2, 122, cashW, 48, C.warn);
  type(11, 500, 1.2); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
  ctx.fillText('보유 자금', W/2 - cashW/2 + 18, 152);
  type(26, 800, 0); ctx.textAlign = 'right';
  ctx.fillStyle = g.cashFx > 0 ? '#ffe08a' : C.warn;
  ctx.fillText('₩' + g.cash, W/2 + cashW/2 - 18, 155);

  // 설치한 방어선 요약 — 무엇이 몇 겹 서 있는지
  ctx.textAlign = 'left';
  type(11, 500, 0.4); ctx.fillStyle = C.faint;
  ctx.fillText('전방 방어선  ' + g.works.length + ' / ' + SLOTS.length, W/2 - 356, 152);
  SLOTS.forEach((sd, i)=>{
    const w = g.works.find(o=>o.slot === i);
    const bx = W/2 - 356 + i*54;
    ctx.beginPath(); ctx.roundRect(bx, 158, 48, 8, 2);
    ctx.fillStyle = w ? WORKS[w.kind].col[0] : 'rgba(198,184,142,.18)'; ctx.fill();
  });
  type(11, 500, 0.4); ctx.textAlign = 'right'; ctx.fillStyle = C.faint;
  ctx.fillText('누적 수입  ₩' + g.earned, W/2 + 356, 152);
  const infl = inflation();
  if(infl > 1.01){                                 // 물가가 올랐다는 걸 숨기지 않는다
    type(11, 700, 0.4); ctx.fillStyle = C.warn;
    ctx.fillText('물가  ×' + infl.toFixed(2), W/2 + 356, 132);
  }

  const items = shopItems();
  items.forEach((it, i)=>{
    if(i >= 12) return;
    const r = cardRect(i), hov = cardHover(i);
    const price = it.k === 'bo' ? boostPrice() : costOf(it);
    const own   = g.bought[it.n] || 0;
    const isGun = it.k === 'gun', isWk = it.k === 'wk', isSvc = !!it.svc, isBo = it.k === 'bo';
    const accent = isGun ? (it.br ? BRANCH[it.br].col : C.gun)
                 : isWk || isBo ? C.hp : isSvc ? C.warn : C.tr;
    const rgb    = isGun ? (it.br ? BRANCH[it.br].rgb : '224,130,74')
                 : isWk || isBo ? '111,192,138' : isSvc ? '224,179,63' : '95,159,201';
    const slotsFull = isWk && g.works.length >= SLOTS.length;
    const noBoost   = isBo && !boostable().length;
    const can = !it.sold && g.cash >= price && !slotsFull && !noBoost;

    ctx.save();
    ctx.translate(r.x, r.y - (hov && can ? 3 : 0));
    ctx.globalAlpha = it.sold ? 0.34 : (slotsFull || noBoost) ? 0.45 : 1;
    if(hov && can){ ctx.shadowColor = `rgba(${rgb},.4)`; ctx.shadowBlur = 20; }
    plate(0, 0, r.w, r.h, null,
          hov && can ? `rgba(${rgb.split(',').map(v=>Math.round(+v*0.22)).join(',')},.97)`
                     : 'rgba(13,15,17,.95)');
    ctx.shadowBlur = 0;
    if(hov && can){ ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.strokeRect(1,1,r.w-2,r.h-2); }
    ctx.fillStyle = accent; ctx.fillRect(9, 0, r.w - 9, 3);

    // 머리 — 분류 / 보유 수 / 단축키
    type(10, 700, 0.8); ctx.textAlign = 'left'; ctx.fillStyle = accent;
    // 계열 전용 품목은 분류를 계열 이름으로 보여준다 — 테크트리를 탔다는 표식
    ctx.fillText(it.br ? BRANCH[it.br].n : isGun ? '총기' : isWk ? '방어선'
                 : isBo ? '보강' : isSvc ? '보급' : '참호', 14, 21);
    if(own > 0){
      type(9, 500, 0.3); ctx.fillStyle = C.faint;
      ctx.fillText('보유 ' + own, it.br ? 74 : 58, 21);
    }
    keycap(r.w - 36, 7, String(i + 1), hov && can ? accent : C.faint, 22, 17);

    // 아이콘 + 이름
    if('filter' in ctx) ctx.filter = 'grayscale(.72) sepia(.32) saturate(1.25) brightness(1.05)';
    type(23, 400, 0); ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText(it.i, 14, 52);
    if('filter' in ctx) ctx.filter = 'none';
    type(16, 700, 0); ctx.fillStyle = C.bone;
    ctx.fillText(it.n, 46, 50);
    type(11, 400, 0.2); ctx.fillStyle = C.dust;
    wrapLeft(it.d, 14, 70, r.w - 28, 14);

    // 아래 한 줄에 가격과 수치 변화를 나란히 — 살까 말까를 여기서 판단한다
    ctx.fillStyle = 'rgba(198,184,142,.13)'; ctx.fillRect(14, 100, r.w - 28, 1);
    type(15, 800, 0); ctx.textAlign = 'left';
    ctx.fillStyle = it.sold ? C.faint : can ? C.warn : C.red;
    ctx.fillText(it.sold ? '품절' : slotsFull ? '자리 없음'
                 : noBoost ? '대상 없음' : '₩' + price, 14, 120);

    ctx.textAlign = 'right';
    if(isBo){
      type(10, 500, 0.3); ctx.fillStyle = C.faint;
      ctx.fillText(noBoost ? '설치한 방어선 없음'
                   : '보강 가능 ' + boostable().length + '곳', r.w - 14, 120);
    }else if(isWk){
      const W2 = WORKS[it.wk];
      const hp = workMax(it.wk, 1);
      type(10, 500, 0.3); ctx.fillStyle = C.faint;
      ctx.fillText((it.wk === 'mine' ? '지뢰 ' + hp + '발' : '내구도 ' + hp)
                   + (W2.blocks ? ' · 저지' : ' · 통과'), r.w - 14, 120);
    }else{
      const pv = previewOf(it);
      if(pv.length){
        const p = pv[0];
        type(13, 700, 0); ctx.fillStyle = accent;
        const wTo = ctx.measureText(p.to).width;
        ctx.fillText(p.to, r.w - 14, 120);
        type(10, 500, 0); ctx.fillStyle = 'rgba(167,157,132,.62)';
        ctx.fillText(p.label + '  ' + p.from + '  →', r.w - 18 - wTo, 120);
      }else{
        type(10, 500, 0.3); ctx.fillStyle = C.faint;
        ctx.fillText('즉시 적용', r.w - 14, 120);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  });

  // 버튼 둘
  shopBtn(BTN_REROLL, '진열 교체  ₩' + rerollCost(), g.cash >= rerollCost(), C.tr, 'R');
  shopBtn(BTN_GO, cleared ? '웨이브 ' + (g.wave+1) + ' 시작' : '전투 복귀', true, C.hp, 'Enter');

  type(11, 500, 0.8); ctx.textAlign = 'center'; ctx.fillStyle = C.faint;
  ctx.fillText('숫자키로 구매  ·  전투 중에도 B 로 이 화면을 연다  ·  돈은 다음 웨이브로 넘어간다', W/2, 706);

  if(g.deny > 0){                                  // 돈이 모자랄 때
    type(13, 700, 0.6); ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(217,72,58,${Math.min(1, g.deny)})`;
    ctx.fillText('자금 부족', W/2, 182);
  }
}
function shopBtn(b, label, on, col, hint){
  const hov = inBtn(b);
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 4);
  ctx.fillStyle = on ? (hov ? `rgba(255,255,255,.10)` : 'rgba(255,255,255,.04)')
                     : 'rgba(255,255,255,.02)';
  ctx.fill();
  ctx.strokeStyle = on ? col : 'rgba(198,184,142,.18)'; ctx.lineWidth = hov && on ? 2 : 1;
  ctx.stroke();
  type(13, 700, 0.4); ctx.textAlign = 'center';
  ctx.fillStyle = on ? col : C.faint;
  ctx.fillText(label, b.x + b.w/2, b.y + 25);
  type(9, 500, 0.6); ctx.fillStyle = C.faint;
  ctx.fillText(hint, b.x + b.w/2, b.y + b.h + 12);
}
/* 좌측 정렬 줄바꿈 — 카드 설명이 두 줄까지 흐르게 */
function wrapLeft(txt, x, y, maxw, lh){
  const words = txt.split(' '); let line = '', yy = y;
  ctx.textAlign = 'left';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxw && line){ ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  });
  ctx.fillText(line, x, yy);
}

/* ── 계열 선택 ─────────────────────────────────────────────
   총기 5회 강화에 딱 한 번 열린다. 되돌릴 수 없으니 두 장을 크게 놓고
   무엇이 달라지는지(단계 보너스 · 진열 품목)를 카드에 적어둔다.
   ─────────────────────────────────────────────────────── */
const BR_KEYS = ['rate', 'pierce'];
function brRect(i){ return {x: W/2 - 452 + i*472, y: 250, w: 432, h: 268}; }
function brHover(i){
  const r = brRect(i);
  return mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h;
}
function drawBranch(){
  const sc = ctx.createLinearGradient(0, 0, 0, H);
  sc.addColorStop(0, 'rgba(5,7,8,.93)');
  sc.addColorStop(1, 'rgba(5,7,8,.96)');
  ctx.fillStyle = sc; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  type(11, 600, 5); ctx.fillStyle = C.warn;
  ctx.fillText('총 기  1 단 계  도 달', W/2, 118);
  type(38, 800, 0.5); ctx.fillStyle = C.bone;
  ctx.fillText('계열을 고른다', W/2, 164);
  type(13, 500, 0.4); ctx.fillStyle = C.dust;
  ctx.fillText('한 번 고르면 되돌릴 수 없다 · 이후 강화 5회마다 이 계열의 다음 단계로 올라간다', W/2, 194);

  BR_KEYS.forEach((k, i)=>{
    const B = BRANCH[k], r = brRect(i), hov = brHover(i);
    ctx.save();
    ctx.translate(r.x, r.y - (hov ? 5 : 0));
    if(hov){ ctx.shadowColor = `rgba(${B.rgb},.5)`; ctx.shadowBlur = 30; }
    plate(0, 0, r.w, r.h, null,
          hov ? `rgba(${B.rgb.split(',').map(v=>Math.round(+v*0.2)).join(',')},.97)`
              : 'rgba(13,15,17,.95)');
    ctx.shadowBlur = 0;
    if(hov){ ctx.strokeStyle = B.col; ctx.lineWidth = 2; ctx.strokeRect(1, 1, r.w-2, r.h-2); }
    ctx.fillStyle = B.col; ctx.fillRect(9, 0, r.w - 9, 3);

    if('filter' in ctx) ctx.filter = 'grayscale(.7) sepia(.3) saturate(1.3) brightness(1.05)';
    type(44, 400, 0); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(B.i, r.w/2, 84);
    if('filter' in ctx) ctx.filter = 'none';

    type(27, 800, 0.4); ctx.fillStyle = C.bone; ctx.fillText(B.n, r.w/2, 130);
    type(14, 500, 0.3); ctx.fillStyle = B.col;  ctx.fillText(B.d, r.w/2, 158);
    ctx.fillStyle = 'rgba(198,184,142,.14)'; ctx.fillRect(24, 178, r.w - 48, 1);
    type(12, 500, 0.2); ctx.fillStyle = C.dust;
    wrapLeft(B.sub, 24, 200, r.w - 48, 18);

    // 이 계열의 최종 형태까지 미리 보여준다
    type(10, 500, 0.4); ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
    ctx.fillText(B.tiers.slice(1).join('  ›  '), 24, 246);
    keycap(r.w - 44, 16, String(i + 1), hov ? B.col : C.faint, 26, 20);
    ctx.restore();
  });

  type(12, 500, 1); ctx.textAlign = 'center'; ctx.fillStyle = C.faint;
  ctx.fillText('클릭 또는 1 / 2', W/2, 566);
}

/* ── 설치 화면 ─────────────────────────────────────────────
   상점을 살짝 덮고 실제 전장을 보여준다. 마우스 높이가 곧 거리라서
   화면 y 를 거리로 되돌려(yToD) 가까운 빈 자리를 집는다.
   ─────────────────────────────────────────────────────── */
function drawPlace(){
  const it = g.pick; if(!it) return;
  const boost = state === 'boost';
  const W2 = boost ? null : WORKS[it.wk];
  ctx.fillStyle = 'rgba(6,8,9,.34)'; ctx.fillRect(0, 0, W, H);
  const sel = nearestSlot(mouse.y, boost ? 'used' : 'free');

  /* 띠를 먼저 다 깔고 미리보기를 그 위에 올린다.
     같은 루프에서 처리하면 앞 슬롯의 띠가 뒤 슬롯의 미리보기에 덮여 사라진다.
     라벨은 띠 왼쪽 끝에 붙인다 — 아래에 두면 원근 때문에 다음 띠와 겹친다. */
  SLOTS.forEach((sd, i)=>{
    const w = g.works.find(o=>o.slot === i);
    const ok = boost ? !!w && w.lv < WORK_LV_MAX : !w;
    const y = projY(sd), s = projS(sd);
    const xl = projX(-FUNNEL*1.05, sd), xr = projX(FUNNEL*1.05, sd);
    const on = ok && i === sel;
    ctx.fillStyle = !ok ? 'rgba(120,120,120,.10)'
                  : on  ? 'rgba(111,192,138,.26)' : 'rgba(111,192,138,.10)';
    ctx.beginPath();
    ctx.moveTo(xl, y - 4*s); ctx.lineTo(xr, y - 4*s);
    ctx.lineTo(xr + 8*s, y + 10*s); ctx.lineTo(xl - 8*s, y + 10*s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = !ok ? 'rgba(150,150,150,.3)'
                    : on ? '#6fc08a' : 'rgba(111,192,138,.4)';
    ctx.lineWidth = on ? 2 : 1; ctx.stroke();

    // 라벨 — 보강 화면에서는 지금 등급과 올라간 뒤를 같이 보여준다
    let label = (i+1) + ' · ' + sd.toFixed(1) + 'm';
    if(boost){
      label += w ? (w.lv >= WORK_LV_MAX ? '  최대 등급'
                    : '  ' + WORKS[w.kind].lvName[w.lv-1] + ' → ' + WORKS[w.kind].lvName[w.lv])
                 : '  비어 있음';
    }else if(w) label += '  사용 중';
    type(on ? 12 : 11, 700, 0.4); ctx.textAlign = 'right';
    ctx.fillStyle = !ok ? C.faint : on ? '#9fe8b8' : 'rgba(111,192,138,.78)';
    ctx.fillText(label, xl - 14*s - 6, y + 5);
  });
  if(sel >= 0 && !boost){                           // 고른 자리에만 반투명 미리보기
    const hp = workMax(it.wk, 1);
    drawWork({kind: it.wk, d: SLOTS[sel], lv: 1, hp, max: hp, fx: 0}, 0.5);
  }

  // 안내
  const w = boost ? g.works.find(o=>o.slot === sel) : null;
  ctx.textAlign = 'center';
  type(11, 600, 4); ctx.fillStyle = C.hp;
  ctx.fillText(boost ? '보 강 대 상' : '설 치 위 치', W/2, 60);
  type(28, 800, 0.4); ctx.fillStyle = C.bone;
  ctx.fillText(boost ? (w ? WORKS[w.kind].n + '  ' + (w.lv+1) + '등급' : '방어선 보강') : W2.n, W/2, 98);
  type(13, 500, 0.3); ctx.fillStyle = C.dust;
  ctx.fillText(boost
    ? (w ? '내구도 ' + Math.round(w.max) + ' → ' + workMax(w.kind, w.lv+1) + ' · 전량 수리' : it.d)
    : W2.d, W/2, 124);
  type(12, 500, 0.8); ctx.fillStyle = C.faint;
  ctx.fillText('클릭 또는 1 / 2 / 3  ·  우클릭 · ESC 취소   ₩'
               + (boost ? (w ? boostCost(w) : boostPrice()) : costOf(it)), W/2, 152);
}


/* 스텐실 제목 — 어두운 사본을 아래로 깔고 그 위에 본색을 올려
   판에 찍어낸 것처럼 보이게 한다 */
function stencil(txt, cx, y, size, col, sp){
  type(size, 800, sp || 0); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(txt, cx + 4, y + 5);
  ctx.fillStyle = 'rgba(20,10,8,.9)'; ctx.fillText(txt, cx + 1.5, y + 2);
  ctx.fillStyle = col;                 ctx.fillText(txt, cx, y);
}

  if(best){                                        // 인식표에 새긴 최고 점수

const DEPTH = [];                                // 깊이 정렬용 재사용 버퍼
/* 같은 거리면 방어선(kind 가 있는 쪽)을 살짝 앞에 둔다 */
const depthCmp = (a, b) => (b.d - (b.kind ? 0.001 : 0)) - (a.d - (a.kind ? 0.001 : 0));

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, W, H);
  // 자간은 컨텍스트에 남으므로 프레임마다 초기화한다
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.save();
  if(g && g.shake > 0)
    ctx.translate((Math.random()-0.5)*g.shake, (Math.random()-0.5)*g.shake);

  drawSky();
  drawGround();

  if(g){
    ctx.drawImage(gore, 0, 0);                        // 시체 층 — 살아있는 좀비 아래에
    drawMotes(g.t);                                   // 공중의 먼지 — 공기감
    /* 좀비와 방어선을 거리 하나로 묶어 먼 것부터 그린다.
       따로 그리면 방어선 앞에 선 좀비가 방어선 뒤로 숨는다.
       버퍼를 재사용한다 — 800마리에서 프레임마다 배열 세 개를 새로 만들 이유가 없다. */
    DEPTH.length = 0;
    for(let i=0;i<g.zombies.length;i++) DEPTH.push(g.zombies[i]);
    for(let i=0;i<g.works.length;i++)   DEPTH.push(g.works[i]);
    DEPTH.sort(depthCmp);
    for(let i=0;i<DEPTH.length;i++){
      const o = DEPTH[i];
      if(o.kind) drawWork(o); else drawZombie(o);
    }
    drawBooms();

    // 예광탄 — 굵고 어두운 잔광 위에 얇고 뜨거운 심을 겹친다
    g.tracers.forEach(t=>{
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const pw = Math.min(t.pierce, 5);
      ctx.strokeStyle = `rgba(255,150,60,${t.life*0.18})`;
      ctx.lineWidth = 2.4 + pw*0.9;
      ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,238,196,${t.life*0.6})`;
      ctx.lineWidth = 1 + pw*0.35;
      ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    });
    /* 혈흔 — arc + fill 은 입자 하나당 경로를 만든다. 700개면 그게 다 비용이다.
       사각형으로 바꾸고, 알파를 6단계로 뭉개 같은 색끼리 몰아 그려서
       fillStyle 문자열 조립 횟수를 700번에서 6번으로 줄인다. */
    const buckets = [[],[],[],[],[],[]];
    g.parts.forEach(p=>{
      const a = Math.min(1, p.life*1.6);
      buckets[Math.min(5, (a*6)|0)].push(p);
    });
    for(let bi=0;bi<6;bi++){
      const list = buckets[bi];
      if(!list.length) continue;
      ctx.fillStyle = BLOOD[bi];
      for(let i=0;i<list.length;i++){
        const p = list[i], r = p.r*0.95;         // 크면 붉은 블록처럼 보여서 시야를 먹는다
        ctx.fillRect(p.x - r*0.5, p.y - r*0.5, r, r);
      }
    }
  }

  drawTrench();
  drawGun();

  if(g){
    // 탄피
    g.shells.forEach(s=>{
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.r);
      ctx.fillStyle = `rgba(214,176,88,${Math.min(1, s.life)})`;
      ctx.fillRect(-5, -2, 10, 4); ctx.restore();
    });
    // 데미지 숫자 — 합쳐진 값이 커질 때 한 번 튄다
    ctx.textAlign = 'center';
    g.nums.forEach(n=>{
      ctx.globalAlpha = Math.min(1, n.life*1.6);
      type(15 + (n.pop || 0)*6, 800, 0);
      ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillText(n.txt, n.x + 1.5, n.y + 1.5);
      ctx.fillStyle = n.c;              ctx.fillText(n.txt, n.x, n.y);
      ctx.globalAlpha = 1;
    });
    /* 총구 섬광 — 화면 전체를 균일하게 띄우면 밤 하늘까지 밝아져 조명이 아니게 된다.
       총구를 광원으로 삼아 참호와 가까운 좀비만 물들인다. */
    /* 0.30 이면 연사 중에 좀비 떼 전체가 주황색으로 씻겨나갔다.
       "번쩍인다"만 남기고 세기를 절반 이하로 낮춘다. */
    if(g.flash > 0.05){
      const a = gunAim();
      ctx.globalCompositeOperation = 'lighter';
      const lg = ctx.createRadialGradient(a.mx, a.my, 0, a.mx, a.my, 540);
      lg.addColorStop(0,    `rgba(255,214,148,${g.flash*0.13})`);
      lg.addColorStop(0.34, `rgba(255,176,96,${g.flash*0.055})`);
      lg.addColorStop(1,    'rgba(255,150,60,0)');
      ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.restore();

  // 비네트
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.92);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  /* 피격 적색 비네트 — 예전엔 화면 전체가 분홍으로 물들어 정작 몰려오는 좀비가
     안 보였다. 가장자리로 몰고 세기를 낮춰 "맞았다"만 전달한다. */
  if(g && g.hurtFx > 0){
    const hv = ctx.createRadialGradient(W/2, H*0.56, H*0.30, W/2, H*0.56, H*0.95);
    hv.addColorStop(0,   'rgba(190,20,20,0)');
    hv.addColorStop(0.62,`rgba(184,22,18,${g.hurtFx*0.15})`);
    hv.addColorStop(1,   `rgba(168,18,14,${g.hurtFx*0.46})`);
    ctx.fillStyle = hv; ctx.fillRect(0, 0, W, H);
  }

  if(state === 'playing') { drawHUD(); drawUpFx(); drawCross(); }
  if(state === 'shop')    { drawShop(); drawUpFx(); drawCross(); }
  if(state === 'branch')  { drawBranch(); drawCross(); }
  if(state === 'place' || state === 'boost'){ drawPlace(); drawCross(); }
  if(state === 'menu')    { drawMenu();  drawCross(); }
  if(state === 'gameover'){ drawOver();  drawCross(); }
}

/* 상점·설치 클릭 — 판정은 cardRect() / nearestSlot() 하나만 본다 */
cv.addEventListener('mousedown', ()=>{
  if(state === 'place'){ placeAt(nearestSlot(mouse.y, 'free')); return; }
  if(state === 'boost'){ boostAt(nearestSlot(mouse.y, 'used')); return; }
  if(state === 'branch'){
    for(let i=0;i<BR_KEYS.length;i++) if(brHover(i)){ pickBranch(BR_KEYS[i]); return; }
    return;
  }
  if(state !== 'shop') return;
  if(inBtn(BTN_GO)){ closeShop(); return; }
  if(inBtn(BTN_REROLL)){ reroll(); return; }
  const items = shopItems();
  for(let i=0;i<items.length && i<12;i++){
    if(cardHover(i)){ buy(items[i]); return; }
  }
});

/* ── 루프 ──────────────────────────────────────────────── */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
resize();
newGame(); state = 'menu';       // 메뉴 뒤에서도 배경이 살아있게
requestAnimationFrame(loop);
</script>
</body>
</html>
