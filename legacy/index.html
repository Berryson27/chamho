<script>
"use strict";

/* ── 죽었을 때 검은 화면 대신 원인을 보여준다 ──────────── */
function showFatal(msg){
  const el = document.getElementById('fatal');
  if(!el) return;
  el.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;'
    + 'align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center;'
    + 'font-size:15px;line-height:1.7;color:#e8b4a8;background:rgba(20,6,6,.94);z-index:9';
  el.innerHTML = '<div style="font-size:22px;font-weight:700;color:#e04a3a">실행 오류</div>'
    + '<div style="color:#c9bfb4">' + String(msg).replace(/</g,'&lt;') + '</div>'
    + '<div style="font-size:13px;color:#8b98a4">브라우저를 최신 Chrome / Edge 로 열어보세요.</div>';
}
addEventListener('error', e => showFatal(e.message + '  (line ' + e.lineno + ')'));

/* ── 구형 브라우저용 roundRect 폴리필 ──────────────────── */
if(typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    const k = Math.min(typeof r === 'number' ? r : 0, Math.abs(w)/2, Math.abs(h)/2);
    this.moveTo(x + k, y);
    this.arcTo(x + w, y,     x + w, y + h, k);
    this.arcTo(x + w, y + h, x,     y + h, k);
    this.arcTo(x,     y + h, x,     y,     k);
    this.arcTo(x,     y,     x + w, y,     k);
    this.closePath();
    return this;
  };
}

/* ── localStorage 는 file:// 이나 쿠키 차단 시 예외를 던진다 ── */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ══════════════════════════════════════════════════════════
   참호 사수 — 1인칭 시점을 흉내낸 2D 웨이브 디펜스
   좌표계: 논리 해상도 1280x720 고정, 화면에 맞춰 letterbox 스케일
   원근: 거리 d 를 1/(d+K) 로 투영 → y, 크기, 좌우폭이 같은 비율로 커진다.
         K 가 있어서 근거리에서 과하게 부풀지 않는다.
   ══════════════════════════════════════════════════════════ */

const W = 1280, H = 720;
const HORIZON = 290;          // 지평선 y
const PROJ_K  = 0.6;          // 원근 완충
const PROJ_Y  = 432;          // 발 위치 = HORIZON + PROJ_Y*p
const PROJ_X  = 436;          // 화면x = 640 + wx*PROJ_X*p
const PROJ_S  = 4.0;          // 스케일 = PROJ_S*p
const D_SPAWN = 7.2;          // 스폰 거리 — 가깝게 붙여서 에임게임이 되지 않게
const D_MELEE = 1.0;          // 이 거리에서 멈춰 참호를 때리기 시작한다
/* 동시 생존 좀비 상한. 웨이브 총량과는 별개다.
   250 으로 묶었을 때는 관통 빌드가 250마리를 영원히 앞질러서 후반에 참호가
   아예 긁히지도 않았다(자동플레이 44웨이브 내내 내구도 만피). 압박은 결국
   "한 번에 몇 마리가 밀려오는가"에서 나오므로, 렌더 비용을 줄여 확보한
   여유만큼 올린다. 실측 2.77ms/212마리 → 550마리에서도 8ms 안쪽. */
const MAX_LIVE = 550;
const FUNNEL  = 1.85;         // 좀비가 지나올 수 있는 통로 반폭(wx 단위)
                              // 양옆은 철조망으로 막혀 있어 전부 여기로 몰린다

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ── 화면 맞춤 ─────────────────────────────────────────── */
let view = {x:0, y:0, s:1};
function resize(){
  // 창 크기를 아직 모르는 시점(임베드·헤드리스)에 0 이 오면 캔버스가 사라진 채
  // 리사이즈 이벤트를 영원히 못 받는다. 최소 스케일로 막아둔다.
  const s = Math.max(0.2, Math.min(innerWidth / W, innerHeight / H) || 1);
  cv.width = W; cv.height = H;
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  const r = cv.getBoundingClientRect();
  view = {x:r.left, y:r.top, s};
}
addEventListener('resize', resize);
addEventListener('load', resize);              // 폰트·레이아웃이 잡힌 뒤 한 번 더

/* ── 입력 ──────────────────────────────────────────────── */
const mouse = {x: W/2, y: HORIZON + 60, down:false};
function toLocal(e){
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / (r.width  / W);
  mouse.y = (e.clientY - r.top ) / (r.height / H);
}
cv.addEventListener('mousemove', toLocal);
cv.addEventListener('mousedown', e=>{ toLocal(e); mouse.down = true; audioInit(); onClick(); });
addEventListener('mouseup',   ()=> mouse.down = false);
cv.addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(state === 'branch'){                      // 계열은 반드시 골라야 넘어간다
    if(k === '1') pickBranch('rate');
    if(k === '2') pickBranch('pierce');
    return;
  }
  if(state === 'place' || state === 'boost'){   // 자리 고르기가 전부
    if(k === 'escape' || k === 'b') cancelPlace();
    if(['1','2','3'].includes(k)){
      if(state === 'boost') boostAt(+k - 1); else placeAt(+k - 1);
    }
    return;
  }
  if(state === 'shop'){
    if(k === 'escape' || k === 'enter' || k === 'b' || k === ' '){ e.preventDefault(); closeShop(); }
    if(k === 'r') reroll();
    if('123456789'.includes(k) && k !== '0') buy(shopItems()[+k - 1]);
    return;
  }
  if(k === 'r') tryReload();
  if(k === 'b' && state === 'playing'){ openShop(); return; }
  if(k === ' '){ e.preventDefault(); onClick(); }
  if(state !== 'playing' && (k === 'enter' || k === ' ')) onClick();
});

/* ── 사운드 (외부 파일 없이 WebAudio로 합성) ───────────── */
let AC = null, noiseBuf = null;
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const n = AC.sampleRate * 0.5;
  noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
}
function env(node, vol, atk, dec){
  const g = AC.createGain();
  g.gain.setValueAtTime(0, AC.currentTime);
  g.gain.linearRampToValueAtTime(vol, AC.currentTime + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + atk + dec);
  node.connect(g); g.connect(AC.destination);
  return g;
}
function sfxShot(power){
  if(!AC) return;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const lp = AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(3200, AC.currentTime);
  lp.frequency.exponentialRampToValueAtTime(280, AC.currentTime + 0.14);
  src.connect(lp); env(lp, 0.28, 0.001, 0.16); src.start(); src.stop(AC.currentTime + 0.2);
  const o = AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(150 - power*30, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(45, AC.currentTime + 0.12);
  env(o, 0.35, 0.001, 0.13); o.start(); o.stop(AC.currentTime + 0.2);
}
function sfxClick(f, vol){
  if(!AC) return;
  const o = AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(f, AC.currentTime);
  env(o, vol||0.06, 0.001, 0.05); o.start(); o.stop(AC.currentTime + 0.08);
}
function sfxHit(){
  if(!AC) return;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 420;
  src.connect(bp); env(bp, 0.22, 0.001, 0.07); src.start(); src.stop(AC.currentTime + 0.1);
}
function sfxDeath(){
  if(!AC) return;
  const o = AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(160 + Math.random()*60, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + 0.32);
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900;
  o.connect(lp); env(lp, 0.12, 0.01, 0.32); o.start(); o.stop(AC.currentTime + 0.4);
}
function sfxHurt(){
  if(!AC) return;
  const o = AC.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(90, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(30, AC.currentTime + 0.3);
  env(o, 0.4, 0.005, 0.3); o.start(); o.stop(AC.currentTime + 0.4);
}
/* 참호(통나무·모래주머니)를 후려치는 둔탁한 소리 */
function sfxThud(){
  if(!AC) return;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const lp = AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(520, AC.currentTime);
  lp.frequency.exponentialRampToValueAtTime(110, AC.currentTime + 0.16);
  src.connect(lp); env(lp, 0.16, 0.002, 0.17); src.start(); src.stop(AC.currentTime + 0.25);
  const o = AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(96, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(52, AC.currentTime + 0.14);
  env(o, 0.2, 0.002, 0.15); o.start(); o.stop(AC.currentTime + 0.22);
}
function sfxWave(){
  if(!AC) return;
  [0,0.16,0.32].forEach((t,i)=>setTimeout(()=>sfxClick(440 + i*160, 0.09), t*1000));
}

/* ── 좀비 종류 ─────────────────────────────────────────── */
/* dmg = 참호를 한 번 후려칠 때 깎이는 내구도, hit = 공격 간격(초) */
const TYPES = {
  walker: {hp: 13,  spd: 0.84, sz: 1.00, body:[86,104,72],  head:[150,158,120], score: 10, dmg: 3.5, hit: 1.10},
  runner: {hp: 9,   spd: 1.90, sz: 0.88, body:[126,68,58],  head:[176,120,96],  score: 16, dmg: 2.5, hit: 0.65},
  brute:  {hp: 80,  spd: 0.48, sz: 1.55, body:[70,84,88],   head:[128,138,132], score: 45, dmg: 10,  hit: 1.60},

/* ── 강화 단계 이름 (3회 강화마다 외관이 바뀐다) ───────── */
/* 총기는 5회마다, 참호는 3회마다 한 단계 올라간다.
   총기는 1단계(5회)에서 계열이 갈리고, 그 뒤로는 고른 계열의 이름과 외형을 쓴다. */
const GUN_STEP = 5, TR_STEP = 3;
const gunTier = n => Math.min(4, Math.floor(n / GUN_STEP));
const trTier  = n => Math.min(3, Math.floor(n / TR_STEP));
const TR_TIER = ['흙 참호', '판자 보강 참호', '철판 방벽 참호', '요새화 참호'];

/* ── 총기 계열 (테크트리) ──────────────────────────────────
   5회 강화 시점에 한 번 갈라지고 되돌릴 수 없다.
   계열은 이름·외형뿐 아니라 단계 통과 보너스와 상점 진열까지 바꾼다.
   ─────────────────────────────────────────────────────── */
const BRANCH = {
  rate: {
    n:'연사 계열', i:'⚡', col:'#e0a24a', rgb:'224,162,74',
    d:'총열을 늘려 한 번에 여러 발을 뿌린다',
    sub:'2단계부터 동시 발사 +1발 · 단계마다 연사 +12%',
    tiers:['제식 소총', '속사형 개조', '분대지원화기', '기관 포탑', '회전 다연장'],
    /* 연사만 올리면 통로에서 관통 계열을 절대 못 따라간다(자동플레이 16 vs 37웨이브).
       관통이 "한 줄을 꿰뚫어" 표적 수를 곱하듯, 연사는 "여러 줄에 동시에 뿌려서"
       표적 수를 곱해야 대칭이 된다. 그려둔 곁 총열이 실제로 일하게 만든다. */
    up(gg, t){ gg.gun.rate *= 1.12; if(t >= 2) gg.gun.shots += 1; if(t >= 4) gg.gun.mag += 30; },
  },
  pierce: {
    n:'관통 계열', i:'🎯', col:'#c96a4a', rgb:'201,106,74',
    d:'한 발로 줄줄이 꿰뚫는다',
    sub:'단계마다 관통 +1 · 관통·파열 품목이 진열된다',
    tiers:['제식 소총', '관통형 개조', '대물 소총', '열선 관통포', '파열 관통포'],
    up(gg, t){ gg.gun.pierce += 1; if(t >= 4) gg.gun.boom += 20; },
  },
};
/* 지금 총 이름 */
function gunName(){
  const t = gunTier(g.gunUps);
  return g.branch ? BRANCH[g.branch].tiers[t] : BRANCH.rate.tiers[0];
}

/* ── 업그레이드: 총기 트랙 / 참호 트랙 ─────────────────── */

const GUN_UP = [

  {n:'헤드샷 특화',  d:'헤드샷 데미지 +70%',       i:'💀', k:'gun', c:130, f:g=>g.gun.head += 0.7},
  {n:'총열 교체',    d:'데미지 +18% · 연사 +10%',  i:'🔧', k:'gun', c:150, f:g=>{g.gun.dmg *= 1.18; g.gun.rate *= 1.10;}},

  /* br 이 붙은 건 그 계열을 골라야 진열된다 — 이게 테크트리의 실체다 */

   f:g=>{ g.gun.mag += 40; g.gun.reload *= 0.80; }},
  {n:'총열 다발',    d:'동시 발사 +1발',           i:'🌀', k:'gun', c:245, br:'rate', w:2.2,

  {n:'통나무 보강',  d:'참호 내구도 +70 · 전량 수리', i:'🪵', k:'tr', c:100, f:g=>{g.barMax += 70; g.bar = g.barMax;}},

/* ── 전방 방어선 ───────────────────────────────────────────
   내 참호 앞 세 지점에 설치한다. 좀비는 자기보다 앞에 있는 가장 먼 저지물부터
   부수고 와야 하므로, 사거리를 벌어주는 만큼 시간을 산다.
   blocks=true 면 부술 때까지 멈춰 선다. false 면 지나가되 대가를 치른다.
   ─────────────────────────────────────────────────────── */
/* 설치 거리. 더 멀리 두면 좀비를 더 오래 막지만, D_SPAWN 을 7.2 로 당겨놓은 이유
   그대로 — 너무 멀리서 세워두면 표적이 작아져 다시 에임 게임이 된다.
   4.2 에서 좀비 키가 약 100px, 1.9 에서 약 150px 로 여전히 쏠 만한 크기다. */
const SLOTS = [4.2, 2.9, 1.9];
const WORK_LV_MAX = 3;
const WORKS = {
  trench: {
    n:'전방 참호',  i:'🪖', c:110, hp:240, blocks:true, armor:1,
    d:'좀비가 부술 때까지 여기서 멈춘다',

    // 5 였을 때는 웨이브 하나에 통째로 갈려나갔다.
    n:'철조망 지대', i:'🚧', c:80, hp:260, blocks:false, slow:0.42, dps:3,
    d:'지나가는 동안 속도 58% 감소 · 밟힐수록 갈린다',

    d:'밟은 좀비와 주변을 폭파한다',
    col:['#7a6a3e','#3d3520'],
    lvName:['대인 지뢰', '고폭 지뢰', '연쇄 지뢰'],

/* 방어선 등급별 성능. 보강할 때마다 내구도(지뢰는 발수)와 효과가 같이 오른다. */
function workMax(kind, lv){
  return Math.round(WORKS[kind].hp * workHpMul() * (1 + (lv - 1) * 0.85));
}
// slow / boom 이 없는 종류에도 안전하게 답한다 — 없으면 감속 없음(1) / 폭발 없음(0)
function workSlow(w){
  const s = WORKS[w.kind].slow;
  return s == null ? 1 : Math.max(0.16, s - ((w.lv||1) - 1) * 0.09);
}
function workBoom(w){
  return (WORKS[w.kind].boom || 0) * (1 + ((w.lv||1) - 1) * 0.5);
}
function workArmor(w){ return (WORKS[w.kind].armor || 1) * (1 - ((w.lv||1) - 1) * 0.14); }
function boostCost(w){
  return Math.round((70 + WORKS[w.kind].c * 0.55) * Math.pow(1.7, w.lv - 1) * inflation());
}
/* 상점에 항상 떠 있는 서비스 */
const SERVICES = [
  {n:'긴급 보수', i:'🧱', c:70, d:'참호 전량 수리 · 방어선 40% 수리', svc:true,
   f:g=>{ g.bar = g.barMax; g.works.forEach(w=>{ w.hp = Math.min(w.max, w.hp + w.max*0.4); }); }},
  {n:'위생병',    i:'💉', c:90, d:'체력 45 회복', svc:true,
   f:g=>{ g.hp = Math.min(g.maxHp, g.hp + 45); }},
];

/* ── 좀비 한 마리당 현상금 ───────────────────────────────
   cashW 는 난이도를 가장 크게 흔드는 값이다. 수입이 늘면 총이 강해지고,
   총이 강하면 더 오래 살아 또 벌기 때문에 복리로 붙는다.
   0.05 면 죽지 않고(자동플레이 44웨이브+), 0.02 면 12웨이브에서 끝났다. */
const CASH = {walker: 3, runner: 5, brute: 15, boss: 100};
const TUNE = {cashW: 0.015};

/* ── 게임 상태 ─────────────────────────────────────────── */
let state = 'menu';           // menu | playing | shop | branch | place | boost | gameover
let g = null, best = +(store.get('trench_best') || 0);

function newGame(){
  g = {
    hp:120, maxHp:120, score:0, kills:0, wave:0,
    bar:420, barMax:420,                       // 참호 내구도
    gun: {dmg:14, rate:6.5, mag:30, ammo:30, reload:1.3, pierce:1, crit:0.03, head:2.2,
          fall:0.82, boom:0, shots:1},          // boom = 파열탄 피해 / shots = 동시 발사
    reloadT:0, cool:0, recoil:0,
    steal:0, slow:1, armor:1, repair:0, spikes:0,
    gunUps:0, trUps:0, upFx:null,               // 강화 횟수 / 강화 피드백
    branch:null,                                // 총기 계열 — 5회 강화 시점에 갈린다
    combo:0, comboT:0,
    cash:130, earned:0, bought:{},              // 보유 금액 / 누적 수입 / 항목별 구매 횟수
    works:[], stock:[], pick:null,              // 설치한 방어선 / 상점 진열 / 설치 대기 중인 것

    tallyN:null,                                // 지금 커지고 있는 누적 데미지 숫자
    queue:[], spawnT:0, inter:0, waveTxt:0, waveTotal:0,
    shake:0, flash:0, hurtFx:0, barFx:0, hitMark:0, t:0, cashFx:0, deny:0, pierceT:0,
    newBest:false, tip:7.0,                     // tip = 첫 웨이브 조작 안내가 남은 시간
  };
  clearGore();
  restock();
  nextWave();
}

/* ── 웨이브 구성 ───────────────────────────────────────── */
function nextWave(){
  g.wave++;
  const w = g.wave;
  if(w > 1){                                       // 웨이브 사이 기본 보수 + 수리 키트
    g.bar = Math.min(g.barMax, g.bar + g.barMax * (0.14 + g.repair));
  }
  /* 학살하는 맛이 목표라 마리수를 제곱항까지 넣어 올린다.
     예전 `24 + w*7` → w10 에 94마리였고, 지금은 268마리.
     1웨이브는 42로 시작해 초반이 벽이 되지 않게 둔다.
     w1 42 · w3 77 · w5 121 · w8 202 · w10 268 · w15 471 · w20 728 */
  const q = [];
  const total = Math.round(28 + w * 13 + w * w * 1.1);
  for(let i=0;i<total;i++){
    let t = 'walker';
    if(w >= 2 && Math.random() < Math.min(0.14 + w*0.035, 0.46)) t = 'runner';
    if(w >= 4 && Math.random() < Math.min(0.05 + w*0.018, 0.20)) t = 'brute';
    q.push(t);
  }
  if(w % 5 === 0) for(let i=0;i<1 + ((w/5)|0)/2|0;i++) q.push('boss');   // 보스도 늘어난다
  for(let i=q.length-1;i>0;i--){ const j = (Math.random()*(i+1))|0; [q[i],q[j]] = [q[j],q[i]]; }
  g.queue  = q;
  g.waveTotal = q.length;                          // HUD 진행바가 보스까지 세도록

  g.spawnT = 0.5;
  g.waveTxt = 2.2;
  sfxWave();
}
function waveMul(){
  const w = g.wave;
  return {hp: 1 + (w-1) * 0.18, spd: 1 + (w-1) * 0.030, gap: Math.max(0.05, 0.26 - w*0.016)};
}
function spawn(type){
  const T = TYPES[type], m = waveMul();
  g.zombies.push({
    type, d: D_SPAWN + Math.random()*1.2,
    // 균등분포 대신 종모양 분포 — 통로 한가운데가 가장 빽빽하고 가장자리로 갈수록 성기다
    wx: ((Math.random() + Math.random() + Math.random()) / 1.5 - 1) * FUNNEL,
    hp: T.hp * m.hp, max: T.hp * m.hp,
    spd: T.spd * m.spd * (0.9 + Math.random()*0.2),
    sz: T.sz * (0.92 + Math.random()*0.16),
    ph: Math.random()*Math.PI*2,          // 걷기 애니 위상
    hue: (Math.random()*2 - 1) * 14,
    flash: 0, dead: false, sway: (Math.random()*2-1) * 0.35,
    melee: false, hitT: 0, swing: 0,      // 참호 공격 상태
    stand: D_MELEE + Math.random()*0.42,  // 참호 앞에 서는 위치(겹쳐도 층이 지게)
    jit: Math.random()*0.34,              // 방어선 앞에서도 한 줄로 서지 않게
  });
}

/* ── 총구 축 ───────────────────────────────────────────────
   총을 그릴 때와 탄도를 만들 때가 반드시 같은 축을 쓰도록 한 곳에서 계산한다.
   총은 조준점을 향해 회전하고, 총구는 그 회전축 위 BARREL 만큼 떨어진 점이다.
   ─────────────────────────────────────────────────────── */
const BARREL = 376;                                   // 회전 원점 → 총구 거리(로컬)
function gunAim(){
  const rec = g ? g.recoil : 0;
  const rl  = g && g.reloadT > 0 ? Math.sin((1 - g.reloadT / g.gun.reload) * Math.PI) : 0;
  const ox  = W/2 + 158;
  // 74 였을 때는 리시버가 화면 아래로 완전히 빠져서, 3회 강화마다 바뀌는 도색과
  // 노리쇠·금장식이 게임 중엔 한 번도 보이지 않았다. 총을 올려 보이게 한다.
  const oy  = H + 38 + rec*32 + rl*118;
  // 화면 위쪽(-y)이 0도. 조준점 방향으로 총열을 돌린다.
  let ang = Math.atan2(mouse.x - ox, oy - mouse.y);
  ang = Math.max(-1.05, Math.min(1.05, ang)) + rl*0.30;
  return {ox, oy, ang, rl,
          mx: ox + Math.sin(ang)*BARREL,              // 총구 x
          my: oy - Math.cos(ang)*BARREL};             // 총구 y
}

/* ── 투영 헬퍼 ─────────────────────────────────────────── */
const projP = d => 1 / (d + PROJ_K);
const projY = d => HORIZON + PROJ_Y * projP(d);
const projX = (wx,d) => W/2 + wx * PROJ_X * projP(d);
const projS = d => PROJ_S * projP(d);
function box(z){                              // 좀비 화면 사각형
  const s = projS(z.d) * z.sz;
  const h = 92 * s, w = 40 * s;
  const fy = projY(z.d), x = projX(z.wx, z.d);
  return {x: x - w/2, y: fy - h, w, h, cx: x, cy: fy - h/2, fy, s, hh: h*0.26};
}

/* ── 사격 ──────────────────────────────────────────────── */
function onClick(){
  if(state === 'menu' || state === 'gameover'){ newGame(); state = 'playing'; return; }
  if(state === 'playing') fire();
}
/* 우클릭으로 설치 취소 — 잘못 산 걸 되돌릴 유일한 출구 */
cv.addEventListener('contextmenu', ()=>{
  if(state === 'place' || state === 'boost') cancelPlace();
});
function tryReload(){
  if(state !== 'playing' || g.reloadT > 0 || g.gun.ammo >= g.gun.mag) return;
  g.reloadT = g.gun.reload;
  sfxClick(240, 0.05);
  setTimeout(()=>sfxClick(180, 0.05), g.gun.reload*600);
}
function fire(){
  if(state !== 'playing' || g.cool > 0 || g.reloadT > 0) return;
  if(g.gun.ammo <= 0){ tryReload(); return; }

  /* 동시 발사는 탄을 더 먹는다. 1발 값으로 5줄을 훑게 두면 연사 계열이
     관통 계열을 크게 앞질러버린다(자동플레이 52 vs 37웨이브). */
  const sN = Math.max(1, g.gun.shots|0);
  g.gun.ammo = Math.max(0, g.gun.ammo - (1 + ((sN - 1) >> 1)));
  g.cool   = 1 / g.gun.rate;
  g.recoil = 1;
  // 발마다 5씩 흔들면 연사 중엔 화면이 계속 떨려서 좀비를 눈으로 따라갈 수 없다.
  // 총 흔들림은 최소로 두고, 큰 흔들림은 참호가 맞을 때만 쓴다.
  g.shake  = Math.max(g.shake, 2.2);
  g.flash  = 1;
  sfxShot(Math.min(g.gun.dmg / 40, 1));

  const aim = gunAim();
  // 탄피는 리시버 근처(총열 중간쯤)에서 튄다
  g.shells.push({x: aim.ox + Math.sin(aim.ang)*150 + 26, y: aim.oy - Math.cos(aim.ang)*150,
                 vx: 140 + Math.random()*90, vy: -220 - Math.random()*90,
                 r: Math.random()*6, vr: 14, life: 1.4});

  /* 후보를 한 번만 박스로 만들어 두고 발마다 재사용한다.
     동시 발사 4발이면 판정을 네 번 하는데, 550마리를 매번 다시 훑을 이유가 없다. */
  const cand = [];
  for(let i=0;i<g.zombies.length;i++){
    const z = g.zombies[i];
    if(!z.dead) cand.push({z, b: box(z)});
  }

  const shots = Math.max(1, g.gun.shots|0);
  // 동시 발사는 좌우로 퍼진다 — 여러 줄을 동시에 훑는 게 이 계열의 정체성
  const SPREAD = [[0], [-20, 20], [-30, 0, 30], [-42, -14, 14, 42], [-52, -26, 0, 26, 52]];
  const offs = SPREAD[Math.min(shots, 5) - 1];

  let total = 0, anyHead = false, anyCrit = false, best = 0;
  boomLeft = 3;                               // 방아쇠 한 번이 일으킬 폭발 상한
  for(let s=0;s<offs.length;s++){
    const mx = mouse.x + offs[s] * (shots > 1 ? 1 : 0);
    const my = mouse.y + (s % 2 ? 6 : -4) * (shots > 1 ? 1 : 0);

    const hits = cand
      .filter(({z, b}) => !z.dead && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h)
      .sort((a, b) => a.z.d - b.z.d)
      .slice(0, 1 + g.gun.pierce);

    // 예광탄 — 총구에서 총열 축 그대로 뻗어나간다 (총과 절대 어긋나지 않음)
    const ta = Math.atan2(mx - aim.ox, aim.oy - my);
    const reach = Math.max(130, Math.min(Math.hypot(mx - aim.mx, my - aim.my), 300));
    g.tracers.push({x1: aim.mx, y1: aim.my,
                    x2: aim.mx + Math.sin(ta)*reach,
                    y2: aim.my - Math.cos(ta)*reach,
                    life: 1, pierce: hits.length});
    if(!hits.length) continue;
    if(hits.length > best) best = hits.length;

    hits.forEach(({z, b}, idx)=>{
      const head = my < b.y + b.hh;
      const crit = Math.random() < g.gun.crit;
      // 뒤로 갈수록 위력이 조금씩 줄지만, 탄자 안정화를 올리면 거의 그대로 뚫는다
      // 곁 총열은 주 총열보다 약하다 — 동시 발사가 순수 이득이 되지 않게
      const dmg = Math.round(g.gun.dmg * (s === 0 ? 1 : 0.65)
                             * (head ? g.gun.head : 1) * (crit ? 2.2 : 1)
                             * Math.pow(g.gun.fall, idx));
      total += dmg;
      if(head) anyHead = true;
      if(crit) anyCrit = true;
      // 혈흔만 맞은 자리마다 흩는다. 숫자는 아래에서 한 번에 합친다.
      hurtZombie(z, dmg, mx + (idx ? (idx%2?1:-1)*(12+idx*7) : 0), my - idx*8, head, crit);
    });
  }

  if(!total) return;
  g.hitMark = 0.18;
  tally(total, mouse.x, mouse.y - 30, anyHead, anyCrit);

  // 관통 표시는 3명 이상일 때만, 그리고 0.6초에 한 번만.
  // 매 발 띄우면 연사 중에 "관통 x4" 가 초당 스무 개씩 쌓인다.
  if(best >= 3 && g.pierceT <= 0){
    g.pierceT = 0.6;
    // 누적 데미지 숫자가 네 자리까지 커지므로 충분히 떨어뜨린다
    pushNum({x: mouse.x + 96, y: mouse.y - 46, v: -34, life: 0.7, pop: 0,
                 txt: '관통 ' + best, c: '#7fd4ff'});
  }
}
function hurtZombie(z, dmg, px, py, head, crit){
  z.hp -= dmg; z.flash = 1;
  blood(px, py, head ? 6 : 3, projS(z.d));      // 명중 혈흔은 조금만 — 처치할 때 크게 튄다
  sfxHit();
  if(z.hp <= 0 && !z.dead) killZombie(z, head);
}
/* 데미지 숫자는 "맞은 놈마다" 가 아니라 "쏘는 동안 하나" 다.
   좀비마다 합치는 것만으로는 부족했다 — 관통 9면 한 발이 서로 다른 9마리를
   때리니 숫자 아홉 개가 동시에 뜨고, 연사 중엔 상한 22개가 조준점 주위에
   그대로 쌓여 좀비가 안 보였다.
   지금은 방아쇠를 당기고 있는 동안 숫자 하나가 커지기만 한다. 누적 피해가
   보이니 관통이 얼마나 먹는지도 오히려 더 잘 읽힌다. */
const NUM_MAX = 22;
function tally(dmg, px, py, head, crit){
  const n = g.tallyN;
  if(n && n.life > 0.3 && g.nums.indexOf(n) >= 0){
    n.val += dmg; n.txt = String(n.val); n.life = 0.7; n.pop = 1;
    if(crit) n.c = '#ffd24a';
    else if(head && n.c === '#f2ece0') n.c = '#ff7a68';
    return;
  }
  const fresh = {val: dmg, txt: String(dmg), pop: 1, x: px, y: py, v: -54, life: 0.7,
                 c: crit ? '#ffd24a' : head ? '#ff7a68' : '#f2ece0'};
  pushNum(fresh);
  g.tallyN = fresh;
}
/* 떠오르는 글자는 전부 이 문을 통과한다 — 상한을 한 곳에서만 지킨다 */
function pushNum(n){
  while(g.nums.length >= NUM_MAX) g.nums.shift();
  g.nums.push(n);
}
function killZombie(z, head){
  z.dead = true;
  const b = box(z);
  blood(b.cx, b.cy, head ? 26 : 18, b.s);       // 처치 순간이 제일 크게 튀어야 한다
  dropCorpse(z, b);
  g.kills++;
  g.combo++; g.comboT = 2.2;
  g.score += Math.round(TYPES[z.type].score * (1 + g.wave*0.1) * (1 + Math.min(g.combo, 30)*0.02));
  g.hp = Math.min(g.maxHp, g.hp + g.steal);

  /* 현상금. 웨이브 배수를 0.05 로 두면 마리수가 제곱으로 늘어나는 것과 겹쳐
     이중으로 불어난다(1→25웨이브에 수입 80배 vs 물가 43배). 그래서 후반에
     총이 감당 못 할 만큼 강해지고 참호가 긁히지도 않았다.
     마리수 증가 자체가 이미 수입 증가라, 마리당 값은 거의 고정으로 둔다. */
  const pay = Math.max(1, Math.round(CASH[z.type] * (1 + g.wave*TUNE.cashW)));
  g.cash += pay; g.earned += pay; g.cashFx = 1;
  // 금액은 브루트·보스급만 띄운다. 잡졸까지 띄우면 후반에 초당 수십 개가 뜬다.
  if(pay >= 30){
    pushNum({x: b.cx, y: b.cy - 12, v: -48, life: 1.0, pop: 0, txt: '+' + pay, c: '#e8c04a'});
  }
  sfxDeath();

  /* 파열탄 — 관통 계열의 "한 방에 여럿".
     연쇄는 inBoom 으로 한 겹에서 끊고, 한 발당 터지는 횟수도 boomLeft 로 묶는다.
     관통 18 이면 한 발이 18마리를 죽이고 폭발도 18번 나서, 방아쇠 한 번에
     화면이 비어버렸다(자동플레이 51웨이브 · 자금 42만 잉여). */
  if(g.gun.boom > 0 && !inBoom && boomLeft > 0){
    inBoom = true; boomLeft--;
    if(g.booms.length < 26) g.booms.push({x: b.cx, y: b.fy, s: b.s*0.55, life: 1});
    let sum = 0;
    for(let i=0;i<g.zombies.length;i++){
      const o = g.zombies[i];
      if(o.dead || o === z) continue;
      if(Math.abs(o.d - z.d) > 0.3 || Math.abs(o.wx - z.wx) > 0.46) continue;
      const ob = box(o);
      const dmg = Math.round(g.gun.boom);
      sum += dmg;
      hurtZombie(o, dmg, ob.cx, ob.cy, false, false);
    }
    if(sum > 0) tally(sum, b.cx, b.cy - 26, false, false);
    inBoom = false;
  }
}
let inBoom = false;
let boomLeft = 0;                               // 한 발이 일으킬 수 있는 폭발 횟수
/* 시체는 바닥에 쌓인 채 남는다 — 학살한 흔적이 보이도록 */
function dropCorpse(z, b){
  // 배열에 담아두지 않는다 — 눕는 순간 시체 층에 찍고 끝낸다
  paintCorpse(gctx, {
    x: b.cx, y: b.fy, s: b.s * z.sz, hue: z.hue, type: z.type,
    d: z.d,                                     // 거리를 남겨 안개를 같이 먹인다
    rot: (Math.random()*2 - 1) * 0.5,
    pool: 22 + Math.random()*18,
  });
  g.corpseN++;
}
const PART_MAX = 720;                            // 입자 상한 — 학살 규모가 커지면 여기서 막힌다
const BLOOD = [0,1,2,3,4,5].map(i=>{             // 알파 6단계 미리 만들어 둔 혈흔색
  const a = (i + 0.5) / 6;
  return `rgba(${(150 + a*60)|0},26,21,${a.toFixed(2)})`;
});
function blood(x, y, n, s){
  if(g.parts.length > PART_MAX) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 40 + Math.random()*260*Math.min(s,2);
    g.parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60,
                  r: (1 + Math.random()*3) * Math.min(Math.max(s,.4),2.2),
                  life: 0.4 + Math.random()*0.6, max: 1});
  }
}

/* ── 업그레이드 ────────────────────────────────────────── */
/* 가중치를 반영해 하나 뽑아 배열에서 제거 */
function wpick(arr){
  let total = 0;
  for(const c of arr) total += c.w || 1;
  let r = Math.random() * total;
  for(let i=0;i<arr.length;i++){
    r -= arr[i].w || 1;
    if(r <= 0) return arr.splice(i, 1)[0];
  }
  return arr.splice(arr.length - 1, 1)[0];
}
/* ── 카드 효과 미리보기 ────────────────────────────────────
   "데미지 +30%" 만 보여주면 14 가 18 이 되는 걸 플레이어가 암산해야 한다.
   카드마다 설명을 따로 적어두는 대신, 상태 사본에 f() 를 실제로 돌려보고
   달라진 값만 집어낸다 — 업그레이드를 추가해도 여기는 손댈 필요가 없다. */
const PV = [
  ['데미지',    p=>p.gun.dmg.toFixed(1)],
  ['연사',      p=>p.gun.rate.toFixed(2) + '/s'],
  ['탄창',      p=>p.gun.mag + '발'],
  ['재장전',    p=>p.gun.reload.toFixed(2) + '초'],
  ['관통',      p=>(1 + p.gun.pierce) + '명'],
  ['동시 발사', p=>p.gun.shots + '발'],
  ['파열',      p=>String(Math.round(p.gun.boom))],
  ['치명타',    p=>Math.round(p.gun.crit*100) + '%'],
  ['헤드샷',    p=>'x' + p.gun.head.toFixed(1)],
  ['관통 유지', p=>Math.round(p.gun.fall*100) + '%'],
  ['내구도',    p=>String(Math.round(p.barMax))],
  ['최대 체력', p=>String(Math.round(p.maxHp))],
  ['적 속도',   p=>Math.round(p.slow*100) + '%'],
  ['받는 피해', p=>Math.round(p.armor*100) + '%'],
  ['자동 수리', p=>Math.round((0.14 + p.repair)*100) + '%'],
  ['반사 피해', p=>String(Math.round(p.spikes))],
];
function probe(){
  return {gun: Object.assign({}, g.gun), barMax: g.barMax, bar: g.bar,
          maxHp: g.maxHp, hp: g.hp, slow: g.slow, armor: g.armor,
          repair: g.repair, spikes: g.spikes, steal: g.steal};
}
function previewOf(c){
  const a = probe(), b = probe();
  try{ c.f(b); }catch(e){ return []; }
  const out = [];
  PV.forEach(([label, fmt])=>{
    const from = fmt(a), to = fmt(b);
    if(from !== to) out.push({label, from, to});
  });
  return out.slice(0, 2);
}

/* ── 상점 ──────────────────────────────────────────────────
   웨이브가 끝나면 열리고, 전투 중에도 B 로 열 수 있다.
   돈이 되는 만큼 몇 개든 산다 — 웨이브당 한 장만 고르던 제약이 없어졌으므로,
   비싼 걸 노려 아끼는 선택이 생긴다.
   ─────────────────────────────────────────────────────── */
/* 물가 — 웨이브가 올라가면 부품값도 같이 오른다.
   수입은 마리수 증가 때문에 더 빠르게 늘어나므로(1→20웨이브에 약 40배),
   물가를 17%씩 복리로 올려도(20웨이브에 약 17배) 후반이 점점 풍족해진다.
   그 격차가 곧 "총이 괴물이 되는" 구간이다. */
const INFL = 1.17;
function inflation(){ return Math.pow(INFL, Math.max(0, g.wave - 1)); }
/* 방어선 내구도 배수 — 설치하는 웨이브 기준으로 굳는다 */
function workHpMul(){ return 1 + g.wave * 0.34; }
function costOf(it){
  if(!it) return 0;
  const n = g.bought[it.n] || 0;
  const rebuy = Math.pow(it.svc || it.wk ? 1.12 : REBUY, n);
  return Math.round(it.c * rebuy * inflation());
}
function rerollCost(){ return Math.round((28 + g.wave*5) * Math.pow(1.06, Math.max(0, g.wave-1))); }

/* 진열 — 총기 3 + 참호 3 을 가중치로 뽑고, 설치물과 서비스는 항상 판다.
   sold 는 원본 배열의 객체에 붙으므로 새로 채울 때 반드시 지운다. */
function restock(){
  GUN_UP.forEach(it=>{ it.sold = false; });
  TRENCH_UP.forEach(it=>{ it.sold = false; });
  // 계열 전용 품목은 그 계열을 골라야 진열에 낀다
  const guns = GUN_UP.filter(it=>!it.br || it.br === g.branch);
  const trs = TRENCH_UP.slice();
  g.stock = [wpick(guns), wpick(guns), wpick(guns),
             wpick(trs),  wpick(trs),  wpick(trs)];
}
const BOOST = {n:'방어선 보강', i:'🔨', k:'bo',
               d:'설치한 방어선 하나를 한 등급 올린다 · 전량 수리'};
function shopItems(){
  return g.stock.concat(
    Object.keys(WORKS).map(k=>Object.assign({k:'wk', wk:k}, WORKS[k])),
    [BOOST], SERVICES);
}
/* 보강할 수 있는 방어선이 남았는지 */
function boostable(){ return g.works.filter(w=>(w.lv || 1) < WORK_LV_MAX); }
function boostPrice(){
  const list = boostable();
  if(!list.length) return 0;
  return Math.min.apply(null, list.map(boostCost));
}
function openShop(){
  g.pick = null;
  state = 'shop';
  sfxClick(520, 0.06);
}
function closeShop(){
  // 웨이브가 비었을 때 닫으면 다음 웨이브가 시작된다. 전투 중에 열었던 거면 그냥 복귀.
  // 탄창을 채워주는 것도 이때만 — 전투 중에 열어 채우면 무한 탄창이 된다.
  const cleared = !g.queue.length && !g.zombies.length;
  state = 'playing';
  if(cleared){ g.gun.ammo = g.gun.mag; g.reloadT = 0; nextWave(); }
}

function buy(it){
  if(!it || it.sold) return;

  if(it.k === 'bo'){                              // 방어선 보강 — 어느 걸 올릴지 찍는다
    const list = boostable();
    if(!list.length){ g.deny = 1; sfxClick(150, 0.07); return; }
    if(g.cash < boostPrice()){ g.deny = 1; sfxClick(150, 0.07); return; }
    g.pick = it; state = 'boost'; sfxClick(700, 0.07);
    return;
  }
  const price = costOf(it);
  if(g.cash < price){ g.deny = 1; sfxClick(150, 0.07); return; }

  if(it.k === 'wk'){                              // 설치물은 자리를 찍어야 산 게 된다
    if(g.works.length >= SLOTS.length){ g.deny = 1; sfxClick(150, 0.07); return; }
    g.pick = it; state = 'place'; sfxClick(700, 0.07);
    return;
  }
  g.cash -= price;
  g.bought[it.n] = (g.bought[it.n] || 0) + 1;
  it.f(g);
  sfxClick(680, 0.09);

  if(it.svc) return;
  it.sold = true;                                 // 진열품은 하나씩만
  // 트랙별 강화 횟수 — 총기는 5회, 참호는 3회마다 단계가 오른다
  const isGun = it.k === 'gun';
  const step0 = isGun ? GUN_STEP : TR_STEP;
  const tf    = isGun ? gunTier : trTier;
  const n     = isGun ? ++g.gunUps : ++g.trUps;
  const step  = n % step0 || step0;
  const tier  = tf(n);
  const up    = tier > tf(n - 1);

  // 단계를 넘으면 계열 보너스가 붙는다 (연사 계열 연사↑ / 관통 계열 관통↑)
  if(up && isGun && g.branch) BRANCH[g.branch].up(g, tier);

  g.upFx = {
    life: up ? 2.8 : 1.4, k: it.k, tierUp: up, step, total: step0,
    label: up ? (isGun ? gunName() : TR_TIER[tier]) : it.n,
    sub:   up ? (isGun ? '총기 외형이 바뀌었다' : '참호 구조가 바뀌었다')
              : (isGun ? '총기' : '참호') + ' 강화  ' + step + ' / ' + step0,
  };
  if(up){ sfxWave(); g.shake = 14; }

  // 총기 1단계에 도달하면 계열을 고른다 — 되돌릴 수 없는 한 번의 갈림길
  if(isGun && !g.branch && g.gunUps >= GUN_STEP){ g.upFx = null; state = 'branch'; }
}
function pickBranch(k){
  if(state !== 'branch' || !BRANCH[k]) return;
  g.branch = k;
  const t = gunTier(g.gunUps);
  BRANCH[k].up(g, t);                             // 1단계 보너스를 지금 준다
  restock();                                      // 계열 전용 품목이 진열에 들어온다
  g.upFx = {life: 2.8, k: 'gun', tierUp: true, step: GUN_STEP, total: GUN_STEP,
            label: gunName(), sub: BRANCH[k].n + ' 로 갈라졌다'};
  sfxWave(); g.shake = 16;
  state = 'shop';
}
function reroll(){
  const price = rerollCost();
  if(g.cash < price){ g.deny = 1; sfxClick(150, 0.07); return; }
  g.cash -= price; restock(); sfxClick(600, 0.08);
}

/* ── 방어선 설치 ───────────────────────────────────────── */
function slotFree(i){ return !g.works.some(w=>w.slot === i); }
/* 화면 y → 거리. projY 의 역함수라 마우스로 자리를 찍을 수 있다. */
function yToD(y){ return PROJ_Y / Math.max(1, y - HORIZON) - PROJ_K; }
/* want='free' 면 빈 자리, 'used' 면 보강 가능한 자리를 고른다 */
function nearestSlot(y, want){
  const d = yToD(y);
  let bi = -1, bd = 1e9;
  SLOTS.forEach((sd, i)=>{
    if(want === 'used'){
      const w = g.works.find(o=>o.slot === i);
      if(!w || w.lv >= WORK_LV_MAX) return;
    }else if(!slotFree(i)) return;
    const dist = Math.abs(sd - d);
    if(dist < bd){ bd = dist; bi = i; }
  });
  return bi;
}
function placeAt(i){
  if(!g.pick || i < 0 || !slotFree(i)) return;
  const price = costOf(g.pick);
  if(g.cash < price){ g.deny = 1; return; }
  g.cash -= price;
  g.bought[g.pick.n] = (g.bought[g.pick.n] || 0) + 1;
  /* 내구도가 고정이면 1000마리가 몰려오는 후반엔 세우자마자 부서져서
     방어선이 초반 전용 장비가 돼버린다. 값이 오르는 만큼 튼튼해져야 한다. */
  const hp = workMax(g.pick.wk, 1);
  g.works.push({kind: g.pick.wk, slot: i, d: SLOTS[i], lv: 1,
                hp, max: hp, hit: 0, fx: 0});
  g.works.sort((a,b)=>b.d - a.d);                 // 먼 것부터 — 좀비가 만나는 순서
  g.pick = null; state = 'shop';
  sfxWave();
}
/* 방어선 보강 — 등급이 오르고 전량 수리된다 */
function boostAt(i){
  if(i < 0) return;
  const w = g.works.find(o=>o.slot === i);
  if(!w || w.lv >= WORK_LV_MAX) return;
  const price = boostCost(w);
  if(g.cash < price){ g.deny = 1; sfxClick(150, 0.07); return; }
  g.cash -= price;
  g.bought[BOOST.n] = (g.bought[BOOST.n] || 0) + 1;
  w.lv++;
  w.max = workMax(w.kind, w.lv);
  w.hp = w.max;
  w.fx = 1;
  g.upFx = {life: 2.0, k: 'tr', tierUp: false, step: w.lv, total: WORK_LV_MAX,
            label: WORKS[w.kind].n + '  ' + WORKS[w.kind].lvName[w.lv - 1],
            sub: SLOTS[i].toFixed(1) + 'm 방어선 보강  ' + w.lv + ' / ' + WORK_LV_MAX};
  g.pick = null; state = 'shop';
  sfxWave();
}
function cancelPlace(){ g.pick = null; state = 'shop'; sfxClick(220, 0.05); }

/* ── 업데이트 ──────────────────────────────────────────── */
function update(dt){
  if(!g) return;
  g.t += dt;
  g.shake   = Math.max(0, g.shake   - dt*26);
  g.flash   = Math.max(0, g.flash   - dt*9);
  g.hurtFx  = Math.max(0, g.hurtFx  - dt*1.6);
  g.hitMark = Math.max(0, g.hitMark - dt);
  g.recoil  = Math.max(0, g.recoil  - dt*7);
  g.waveTxt = Math.max(0, g.waveTxt - dt);
  g.barFx   = Math.max(0, g.barFx   - dt*2.4);
  g.cashFx  = Math.max(0, g.cashFx  - dt*2.2);
  g.deny    = Math.max(0, g.deny    - dt*0.9);
  if(state === 'playing' && g.wave <= 1) g.tip = Math.max(0, g.tip - dt);
  if(g.comboT > 0 && (g.comboT -= dt) <= 0) g.combo = 0;
  if(g.upFx && (g.upFx.life -= dt) <= 0) g.upFx = null;

  // 파티클/이펙트는 어느 상태에서든 흐른다
  g.parts  = g.parts.filter(p=>{
    p.life -= dt; p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; return p.life > 0;
  });
  g.shells = g.shells.filter(s=>{
    s.life -= dt; s.vy += 1100*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.r += s.vr*dt; return s.life > 0;
  });
  g.nums   = g.nums.filter(n=>{
    n.life -= dt; n.y += n.v*dt; n.v += 60*dt;
    if(n.pop) n.pop = Math.max(0, n.pop - dt*5);
    return n.life > 0;
  });
  g.pierceT = Math.max(0, g.pierceT - dt);
  // 시체 층을 아주 천천히 지운다 — 오래된 것부터 흙에 묻히는 셈
  if((g.goreT += dt) > 2.2){ g.goreT = 0; fadeGore(); }
  g.tracers = g.tracers.filter(t=>{ t.life -= dt*13; return t.life > 0; });

  if(state !== 'playing') return;

  if(g.cool > 0) g.cool -= dt;
  if(g.reloadT > 0){
    g.reloadT -= dt;
    if(g.reloadT <= 0){ g.reloadT = 0; g.gun.ammo = g.gun.mag; }
  }
  if(mouse.down) fire();
  if(g.gun.ammo <= 0 && g.reloadT <= 0) tryReload();

  /* 스폰 — 한 번에 여러 마리씩 쏟아내 밀도를 만든다.
     동시 생존은 MAX_LIVE 로 묶는다. 웨이브 총량(후반 1000마리 이상)은 그대로 두고
     화면에 동시에 서 있는 수만 제한한다 — 죽는 대로 다음 놈이 밀려들어오니
     체감은 끊기지 않으면서, 700마리가 참호에 겹쳐 쌓여 프레임이 무너지는 걸 막는다. */
  if(g.queue.length && g.zombies.length < MAX_LIVE){
    g.spawnT -= dt;
    if(g.spawnT <= 0){
      // 마리수를 크게 늘린 만큼 한 번에 쏟는 양도 웨이브에 비례해 키운다.
      // 안 그러면 700마리가 찔끔찔끔 나와서 웨이브 하나가 몇 분씩 걸린다.
      let burst = 2 + Math.floor(g.wave / 2.5) + (Math.random() < 0.6 ? 1 : 0)
                    + (Math.random() < 0.4 ? 1 : 0);
      while(burst-- > 0 && g.queue.length && g.zombies.length < MAX_LIVE) spawn(g.queue.shift());
      g.spawnT = waveMul().gap * (0.7 + Math.random()*0.6);
    }
  }

  // 방어선 상태 갱신
  g.works.forEach(wk=>{ wk.fx = Math.max(0, wk.fx - dt*2.4); });
  g.booms = g.booms.filter(b=>{ b.life -= dt*2.6; return b.life > 0; });

  // 좀비 전진 / 방어선·참호 공격
  g.zombies.forEach(z=>{
    z.flash = Math.max(0, z.flash - dt*6);
    z.swing = Math.max(0, z.swing - dt*4);
    if(z.dead) return;

    // 자기보다 앞에 있는 저지물 중 가장 먼 것이 지금 상대다.
    // 그게 부서지면 자동으로 다음 것, 마지막엔 내 참호가 된다.
    const wk = blockerFor(z);
    const stop = wk ? wk.d + 0.06 + z.jit : z.stand;

    let mul = 1;                                   // 철조망·지뢰 지대를 통과하는 대가
    g.works.forEach(w=>{
      if(w.hp <= 0 || WORKS[w.kind].blocks) return;
      if(Math.abs(z.d - w.d) > 0.34) return;
      if(WORKS[w.kind].slow){
        mul *= workSlow(w);                        // 등급이 오르면 더 강하게 붙잡는다
        w.hp -= WORKS[w.kind].dps * dt;            // 밟고 지나가는 만큼 갈린다
        w.fx = Math.max(w.fx, 0.35);
      }
    });

    if(z.d > stop){                                 // 아직 전진 중
      const prev = z.d;
      z.d  -= z.spd * g.slow * mul * dt;
      z.ph += dt * (2.4 + z.spd*1.6) * mul;
      z.wx += Math.sin(g.t*1.3 + z.ph) * z.sway * dt * 0.35;
      z.wx = Math.max(-FUNNEL, Math.min(FUNNEL, z.wx));   // 통로 밖으로는 못 나간다
      // 지뢰 — 이번 프레임에 선을 넘었으면 터진다
      g.works.forEach(w=>{
        if(w.hp <= 0 || w.kind !== 'mine') return;
        if(prev > w.d && z.d <= w.d) blowMine(w, z);
      });
      if(z.d <= stop){ z.d = stop; z.melee = true; z.hitT = 0.45; }
    }else{                                          // 눈앞의 것을 때린다
      z.melee = true;
      z.ph += dt * 3.2;
      z.hitT -= dt;
      if(z.hitT <= 0){
        z.hitT = TYPES[z.type].hit;
        z.swing = 1;
        if(wk) hitWork(z, wk); else hitTrench(z);
      }
    }
  });
  g.zombies = g.zombies.filter(z=>!z.dead);
  g.works   = g.works.filter(w=>w.hp > 0);          // 부서진 방어선은 사라진다

  // 웨이브 클리어 → 상점
  if(state === 'playing' && !g.queue.length && !g.zombies.length){
    g.inter += dt;
    if(g.inter > 0.7){
      g.inter = 0;
      const bonus = 16 + g.wave*6;                  // 웨이브 수당
      g.cash += bonus; g.earned += bonus; g.cashFx = 1;
      restock(); openShop();
    }
  }
}

/* 좀비가 앞에 둔 저지물 중 가장 먼 것 — 그게 지금 부숴야 하는 것이다 */
function blockerFor(z){
  let best = null;
  for(const wk of g.works){
    if(wk.hp <= 0 || !WORKS[wk.kind].blocks) continue;
    if(wk.d >= z.d - 0.02) continue;                // 이미 지나온 것
    if(!best || wk.d > best.d) best = wk;
  }
  return best;
}
/* 방어선을 때린다 — 참호와 달리 내 체력은 깎이지 않는다 */
function hitWork(z, wk){
  const raw = TYPES[z.type].dmg * 1.15;
  wk.hp -= raw * workArmor(wk);
  wk.fx = 1;
  const b = box(z);
  blood(b.cx, projY(wk.d) - 8, 5, projS(wk.d));
  sfxThud();
  if(g.spikes > 0) hurtZombie(z, Math.round(g.spikes*0.6), b.cx, b.fy - b.h*0.35, false, false);
  if(wk.hp <= 0){                                   // 돌파 — 뒤에 남은 놈들이 다시 밀려온다
    g.shake = Math.max(g.shake, 12);
    sfxHurt();
    pushNum({x: projX(0, wk.d), y: projY(wk.d) - 30, v: -40, life: 1.4,
                 txt: WORKS[wk.kind].n + ' 돌파', c: '#ff8a6a'});
  }
}
/* 지뢰 — 밟은 놈과 주변을 함께 날린다 */
function blowMine(wk, z){
  wk.hp -= 1; wk.fx = 1;
  boomLeft = 2;                                   // 지뢰로 죽은 놈도 파열탄을 부를 수 있다
  const W2 = WORKS.mine;
  const x = projX(z.wx, wk.d), y = projY(wk.d);
  g.booms.push({x, y, s: projS(wk.d), life: 1});
  g.shake = Math.max(g.shake, 8);
  sfxThud(); sfxHit();
  let sum = 0;
  const power = workBoom(wk), reach = W2.splash * (1 + ((wk.lv||1) - 1) * 0.3);
  g.zombies.forEach(o=>{
    if(o.dead) return;
    if(Math.abs(o.d - wk.d) > reach || Math.abs(o.wx - z.wx) > reach*1.6) return;
    const ob = box(o);
    const dmg = Math.round(power * (o === z ? 1 : 0.6));
    sum += dmg;
    hurtZombie(o, dmg, ob.cx, ob.cy, false, false);
  });
  if(sum > 0) tally(sum, x, y - 34, false, false);
  blood(x, y - 10, 14, projS(wk.d));
}

/* 참호가 먼저 깎이고, 참호가 무너진 뒤에야 내 체력이 깎인다 */
function hitTrench(z){
  const raw = TYPES[z.type].dmg;
  const b = box(z);
  g.barFx = 1; g.shake = Math.max(g.shake, 9);
  blood(b.cx, 640, 8, 1.2);

  if(g.bar > 0){
    g.bar = Math.max(0, g.bar - raw * g.armor);
    sfxThud();
    if(g.bar === 0){ g.hurtFx = 1; g.shake = 22; }
  }else{
    g.hp -= raw * 0.6;                              // 참호가 뚫린 뒤엔 직접 맞는다
    g.hurtFx = 1; g.shake = 20; sfxHurt();
    if(g.hp <= 0){
      g.hp = 0; state = 'gameover';
      if(g.score > best){ best = g.score; g.newBest = true; store.set('trench_best', best); }
    }
  }
  if(g.spikes > 0){                                 // 대못 방벽 반사 피해
    hurtZombie(z, Math.round(g.spikes), b.cx, b.fy - b.h*0.35, false, false);
  }
}

/* ══════════════════════════════════════════════════════════
   디자인 시스템
   월드가 흙·모래주머니의 warm 톤이라 UI도 뼈색/카키로 맞춘다.
   차가운 청회색을 쓰면 참호 위에 웹 대시보드가 떠 있는 꼴이 된다.
   채도가 있는 색은 "상태"에만 — 총기(주황) / 참호(파랑) / 위험(적) / 체력(녹).
   ══════════════════════════════════════════════════════════ */
const C = {
  ink:   'rgba(9,10,8,.84)',        // 패널 바닥
  edge:  'rgba(198,184,142,.20)',   // 패널 테두리
  lip:   'rgba(255,242,206,.06)',   // 상단 1px 하이라이트
  well:  'rgba(0,0,0,.55)',         // 게이지 홈
  bone:  '#e7e1d0',                 // 1차 텍스트
  dust:  '#a79d84',                 // 2차 텍스트
  faint: '#6f6857',                 // 3차 텍스트
  gun:   '#e0824a',                 // 총기 트랙
  tr:    '#5f9fc9',                 // 참호 트랙
  hp:    '#6fc08a',
  warn:  '#e0b33f',
  red:   '#d9483a',
};

const FONT = '"Pretendard","Malgun Gothic","Segoe UI",sans-serif';
/* 폰트와 자간을 항상 같이 세팅 — 자간이 다음 텍스트로 새지 않게 */
function type(size, weight, spacing){
  ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT;
  if('letterSpacing' in ctx) ctx.letterSpacing = (spacing || 0) + 'px';
}

/* 모서리를 깎은 금속판 — 둥근 사각형보다 군용 느낌이 난다 */
function plate(x, y, w, h, accent, fill){
  const k = 9;
  ctx.beginPath();
  ctx.moveTo(x + k, y);   ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - k); ctx.lineTo(x + w - k, y + h);
  ctx.lineTo(x, y + h);   ctx.lineTo(x, y + k);
  ctx.closePath();
  ctx.fillStyle = fill || C.ink; ctx.fill();
  ctx.strokeStyle = C.edge; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = C.lip; ctx.fillRect(x + k, y, w - k, 1);
  if(accent){                                  // 좌측 액센트 띠
    ctx.fillStyle = accent;
    ctx.fillRect(x, y + k, 2, h - k*2);
  }
}

/* 눈금이 새겨진 계기식 게이지.
   ghost 를 넣으면 최근에 깎인 만큼이 흰 잔상으로 남아 "맞았다"가 읽힌다. */
function gauge(x, y, w, h, v, col, ghost){
  v = Math.max(0, Math.min(1, v));
  ctx.fillStyle = C.well; ctx.fillRect(x, y, w, h);
  if(ghost > 0){
    ctx.fillStyle = `rgba(255,236,214,${ghost*0.5})`;
    ctx.fillRect(x, y, w * Math.min(1, v + ghost*0.06), h);
  }
  const gr = ctx.createLinearGradient(x, y, x, y + h);
  gr.addColorStop(0, 'rgba(255,255,255,.26)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0)');
  gr.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = col;  ctx.fillRect(x, y, w * v, h);
  ctx.fillStyle = gr;   ctx.fillRect(x, y, w * v, h);
  ctx.fillStyle = 'rgba(0,0,0,.32)';           // 10칸 눈금
  for(let i=1;i<10;i++) ctx.fillRect(x + (w/10)*i, y, 1, h);
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* 키캡 — 어떤 키를 누르라는 건지 글자만 적어두면 눈에 안 들어온다 */
function keycap(x, y, label, col, w, h){
  w = w || 22; h = h || 20;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 4);
  ctx.fillStyle = 'rgba(232,226,208,.10)'; ctx.fill();
  ctx.strokeStyle = col || 'rgba(198,184,142,.42)'; ctx.lineWidth = 1; ctx.stroke();
  type(11, 700, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col || C.dust;
  ctx.fillText(label, x + w/2, y + h/2 + 0.5);
  ctx.textBaseline = 'alphabetic';
  return x + w;
}

/* 진행 칸(3칸) — 다음 단계까지 몇 번 남았는지 */
function pips(x, y, n, col, pw, ph, gap, total){
  pw = pw || 16; ph = ph || 6; gap = gap || 6; total = total || 3;
  for(let i=0;i<total;i++){
    ctx.fillStyle = i < n ? col : 'rgba(198,184,142,.20)';
    ctx.beginPath(); ctx.roundRect(x + i*(pw+gap), y, pw, ph, 2); ctx.fill();
  }
  return x + total*(pw+gap) - gap;
}

/* 라벨 → 값 한 줄. HUD 전체가 같은 리듬을 갖게 하는 최소 단위 */
function row(lx, rx, y, label, value, lcol, vcol, vsize){
  type(11, 500, 0.3); ctx.textAlign = 'left';
  ctx.fillStyle = lcol || C.faint; ctx.fillText(label, lx, y);
  type(vsize || 12, 700, 0); ctx.textAlign = 'right';
  ctx.fillStyle = vcol || C.bone;  ctx.fillText(value, rx, y);
}

/* ── 그리기 ────────────────────────────────────────────── */
const mix = (a,b,t)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
const FOG = [26, 32, 40];
function fogT(d){ return Math.max(0, Math.min(0.72, (d - 1.6) / 8)); }

/* ── 색 캐시 ───────────────────────────────────────────────
   mix() 는 배열 map + join + 문자열 조립이라 한 번이 싸도 800마리 × 4색이면
   프레임마다 3천 번이다. 안개와 색조를 몇 단계로 뭉개서 만든 걸 재사용한다.
   눈으로는 구분이 안 가지만 할당이 사라진다. (4종 × 6색조 × 15안개 = 360개)
   ─────────────────────────────────────────────────────── */
const ZCOL = {}, CCOL = {};
function zColors(type, hue, t){
  const hb = ((hue + 16) / 6) | 0, tb = (t * 14) | 0;
  const key = type + hb + '_' + tb;
  let c = ZCOL[key];
  if(!c){
    const T = TYPES[type], h = hb*6 - 16, tt = tb/14;
    c = ZCOL[key] = {
      body: mix(T.body.map(v=>Math.max(0, v + h)), FOG, tt),
      deep: mix(T.body.map(v=>Math.max(0, v*0.52 + h*0.5)), FOG, tt),
      head: mix(T.head.map(v=>Math.max(0, v + h)), FOG, tt),
      dark: mix([14,16,14], FOG, tt*0.8),
    };
  }
  return c;
}
function cColors(type, hue, t){
  const hb = ((hue + 16) / 6) | 0, tb = (t * 14) | 0;
  const key = type + hb + '_' + tb;
  let c = CCOL[key];
  if(!c){
    const T = TYPES[type], h = hb*6 - 16, tt = tb/14;
    c = CCOL[key] = {
      body: mix(T.body.map(v=>Math.max(0, v*0.66 + h - 14)), FOG, tt),
      head: mix(T.head.map(v=>Math.max(0, v*0.66 + h - 14)), FOG, tt),
    };
  }
  return c;
}

/* 공중에 떠 있는 먼지 — 달빛에 걸려 반짝이는 것만으로 공기가 생긴다.
   매 프레임 새로 만들지 않고 고정 시드로 한 번만 배치한다. */
const MOTES = [];
for(let i=0;i<72;i++){
  MOTES.push({
    wx: (((i*53) % 100) / 100 * 2 - 1) * 4.4,
    d:  1.15 + ((i*29) % 82) / 10,
    hh: 0.18 + ((i*17) % 62) / 100,
    ph: i * 0.83,
    sp: 0.22 + ((i*13) % 42) / 100,
  });
}
function drawMotes(t){
  MOTES.forEach(m=>{
    const d  = m.d;
    const wx = m.wx + Math.sin(t*m.sp + m.ph) * 0.10;
    const s  = projS(d);
    const x  = projX(wx, d);
    const y  = projY(d) - (m.hh + Math.sin(t*m.sp*0.7 + m.ph)*0.05) * 92 * s;
    const a  = 0.16 * (1 - fogT(d)) * (0.5 + 0.5*Math.sin(t*1.7 + m.ph));
    if(a <= 0.01) return;
    ctx.fillStyle = `rgba(206,218,238,${a})`;
    const r = Math.max(0.8, 1.15 * s);
    ctx.fillRect(x, y, r, r);
  });
}

function drawSky(){
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0,   '#0a0d16');
  sky.addColorStop(0.55,'#141b28');
  sky.addColorStop(1,   '#2b3140');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HORIZON + 2);

  // 달 + 헤일로
  ctx.save();
  const mg = ctx.createRadialGradient(1010, 96, 8, 1010, 96, 130);
  mg.addColorStop(0, 'rgba(210,220,240,.45)'); mg.addColorStop(1, 'rgba(210,220,240,0)');
  ctx.fillStyle = mg; ctx.fillRect(860, -40, 300, 280);
  ctx.fillStyle = '#d8dceb'; ctx.beginPath(); ctx.arc(1010, 96, 30, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(150,160,185,.35)';
  ctx.beginPath(); ctx.arc(1000, 88, 7, 0, 7); ctx.arc(1020, 106, 5, 0, 7); ctx.fill();
  ctx.restore();

  // 폐허 실루엣
  ctx.fillStyle = '#0d121b';
  const sil = [[0,60],[70,95],[130,50],[210,110],[290,70],[360,120],[450,55],[520,100],
               [600,80],[690,125],[780,65],[860,105],[940,75],[1030,115],[1110,60],[1200,100],[1280,80]];
  ctx.beginPath(); ctx.moveTo(0, HORIZON);
  sil.forEach(([x,h])=>ctx.lineTo(x, HORIZON - h));
  ctx.lineTo(W, HORIZON); ctx.closePath(); ctx.fill();
}

function drawGround(){
  const gr = ctx.createLinearGradient(0, HORIZON, 0, H);
  gr.addColorStop(0,   '#2b3140');
  gr.addColorStop(0.12,'#2a2a26');
  gr.addColorStop(0.5, '#1e1c16');
  gr.addColorStop(1,   '#141310');
  ctx.fillStyle = gr; ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // 지면 디테일 (고정 시드로 배치 → 깊이감)
  for(let i=0;i<90;i++){
    const d  = 1.0 + ((i*37) % 70) / 10;
    const wx = (((i*61) % 100) / 100 * 2 - 1) * 3.6;
    const x = projX(wx, d), y = projY(d), s = projS(d);
    const a = (0.10 + 0.14*Math.min(s,1)) * (1 - fogT(d)*0.8);
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    ctx.beginPath(); ctx.ellipse(x, y, (14 + (i%5)*9)*s, 5*s, 0, 0, 7); ctx.fill();
    if(i % 3 === 0){                                  // 마른 풀 몇 포기
      ctx.strokeStyle = `rgba(92,86,58,${a*1.6})`; ctx.lineWidth = Math.max(0.6, 1.6*s);
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + 5*s, y - 15*s);
      ctx.moveTo(x, y); ctx.lineTo(x - 6*s, y - 11*s);
      ctx.stroke();
    }
  }
  // 좌우를 막은 철조망 벽 — 가운데 통로만 열려 있어서 좀비가 전부 그리로 몰린다
  [1.35, 2.1, 3.2, 4.8, 6.6].forEach((d, li)=>{
    const y = projY(d), s = projS(d);
    const gl = projX(-FUNNEL, d), gr = projX(FUNNEL, d);   // 통로 양쪽 끝
    const a  = 0.62 - li*0.08;
    ctx.strokeStyle = `rgba(126,130,122,${a})`;
    ctx.lineWidth = Math.max(1, 2.6*s);

    // 통로 바깥 구간에만 철조망을 친다
    [[0, gl], [gr, W]].forEach(([x0, x1])=>{
      if(x1 - x0 < 6) return;
      ctx.beginPath();
      for(let x=x0;x<=x1;x+=12) ctx.lineTo(x, y - 26*s + Math.sin(x*0.085 + li)*6*s);
      ctx.stroke();
      ctx.beginPath();
      for(let x=x0;x<=x1;x+=12) ctx.lineTo(x, y - 8*s + Math.sin(x*0.07 - li)*4*s);
      ctx.stroke();
      for(let x=x0+14;x<x1;x+=64){                          // 지지 말뚝
        ctx.beginPath(); ctx.moveTo(x, y + 4*s); ctx.lineTo(x + 3*s, y - 40*s); ctx.stroke();
      }
    });

    // 통로 입구 양쪽에 세운 기둥 — 여기가 문이라는 걸 알려준다
    ctx.strokeStyle = `rgba(150,152,142,${a + 0.18})`;
    ctx.lineWidth = Math.max(1.5, 5*s);
    [gl, gr].forEach(gx=>{
      ctx.beginPath(); ctx.moveTo(gx, y + 6*s); ctx.lineTo(gx, y - 52*s); ctx.stroke();
    });
    // 기둥 밑동 흙무더기
    ctx.fillStyle = `rgba(34,30,22,${a})`;
    [gl, gr].forEach(gx=>{
      ctx.beginPath(); ctx.ellipse(gx, y + 6*s, 20*s, 6*s, 0, 0, 7); ctx.fill();
    });
  });

  // 통로 바닥에 난 발자국 길 — 여기로만 다녔다는 흔적
  const tg = ctx.createLinearGradient(0, HORIZON, 0, projY(D_MELEE));
  tg.addColorStop(0, 'rgba(90,74,48,0)');
  tg.addColorStop(1, 'rgba(90,74,48,.20)');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(projX(-FUNNEL*0.8, D_SPAWN), projY(D_SPAWN));
  ctx.lineTo(projX( FUNNEL*0.8, D_SPAWN), projY(D_SPAWN));
  ctx.lineTo(projX( FUNNEL*0.95, D_MELEE), projY(D_MELEE));
  ctx.lineTo(projX(-FUNNEL*0.95, D_MELEE), projY(D_MELEE));
  ctx.closePath(); ctx.fill();

  // 지평선 안개 — 좀비가 안개를 뚫고 나오는 느낌
  const mist = ctx.createLinearGradient(0, HORIZON - 22, 0, HORIZON + 64);
  mist.addColorStop(0,   'rgba(46,54,66,0)');
  mist.addColorStop(0.35,'rgba(46,54,66,.34)');
  mist.addColorStop(1,   'rgba(46,54,66,0)');
  ctx.fillStyle = mist; ctx.fillRect(0, HORIZON - 22, W, 86);
}

/* ── 시체 층 ───────────────────────────────────────────────
   시체는 한 번 눕고 나면 절대 움직이지 않는데, 매 프레임 260구를 다시 그리느라
   14.5ms 를 쓰고 있었다. 오프스크린 캔버스에 눕는 순간 한 번만 찍고,
   그 판을 통째로 얹는다 — 프레임 비용이 drawImage 한 번으로 줄고,
   상한도 필요 없어져 시체가 무한히 쌓인다(학살의 증거가 그대로 남는다).
   대신 아주 느리게 지워서 오래된 시체가 흙에 묻히게 한다.
   ─────────────────────────────────────────────────────── */
const gore = document.createElement('canvas');
gore.width = W; gore.height = H;
const gctx = gore.getContext('2d');
function clearGore(){ gctx.clearRect(0, 0, W, H); }
function fadeGore(){
  gctx.globalCompositeOperation = 'destination-out';
  gctx.fillStyle = 'rgba(0,0,0,0.05)';
  gctx.fillRect(0, 0, W, H);
  gctx.globalCompositeOperation = 'source-over';
}
/* x = 대상 컨텍스트. 시체 층에 찍을 때만 쓴다. */
function paintCorpse(x, c){
  const s = c.s;
  // 거리만큼 안개에 묻혀야 바닥에 깊이가 생긴다
  const t = Math.max(0.38, fogT(c.d == null ? 1.6 : c.d));
  x.save();
  x.translate(c.x, c.y);
  x.fillStyle = `rgba(74,10,10,${0.6 * (1 - t*0.7)})`;          // 핏자국
  x.beginPath(); x.ellipse(0, 2, c.pool*s, c.pool*s*0.32, 0, 0, 7); x.fill();
  x.rotate(c.rot);
  // 살아있는 놈보다 확실히 어두워야 바닥에 깔린 것으로 읽힌다
  const cc2 = cColors(c.type, c.hue, t);
  x.strokeStyle = 'rgba(18,20,16,.9)'; x.lineWidth = 5.5*s; x.lineCap = 'round';
  x.beginPath();
  x.moveTo(-4*s, -3*s); x.lineTo(-26*s, 7*s);
  x.moveTo(-2*s, -1*s); x.lineTo(-22*s, -11*s);
  x.moveTo( 8*s, -2*s); x.lineTo( 28*s, 6*s);
  x.stroke();
  x.fillStyle = cc2.body;
  x.beginPath(); x.ellipse(0, -2*s, 20*s, 9*s, 0, 0, 7); x.fill();
  x.fillStyle = cc2.head;
  x.beginPath(); x.arc(22*s, -5*s, 8.5*s, 0, 7); x.fill();
  x.restore();
}

/* ── 전방 방어선 ───────────────────────────────────────────
   전부 투영 헬퍼로 그린다. 거리 d 에서의 통로 폭·스케일을 그대로 쓰므로
   먼 자리에 놓으면 작게, 가까운 자리에 놓으면 크게 선다.
   alpha 인자는 설치 미리보기용 반투명.
   ─────────────────────────────────────────────────────── */
function drawWork(wk, alpha){
  const W2 = WORKS[wk.kind];
  const lv = wk.lv || 1;                    // 등급이 없으면 1로 본다
  const d = wk.d, y = projY(d), s = projS(d);
  const xl = projX(-FUNNEL*1.02, d), xr = projX(FUNNEL*1.02, d);
  const t  = fogT(d);
  const ratio = Math.max(0, wk.hp / wk.max);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  const jolt = wk.fx ? Math.sin(wk.fx*30) * wk.fx * 3 * s : 0;
  ctx.translate(0, jolt);

  if(wk.kind === 'trench'){
    // 모래주머니 두 줄 + 통나무 — 내 참호의 축소판
    const hgt = 30*s, bw = 26*s;
    const dark = mix([26,22,16], FOG, t);
    ctx.fillStyle = dark;                                   // 밑동 흙
    ctx.beginPath(); ctx.ellipse((xl+xr)/2, y + 5*s, (xr-xl)/2 + 12*s, 8*s, 0, 0, 7); ctx.fill();
    for(let x = xl; x < xr + bw; x += bw*1.72){
      const broken = ratio < 0.5 && ((x*7|0) % 10) / 10 > ratio*1.9;
      if(broken){                                           // 터져나간 자리
        ctx.fillStyle = mix([64,56,40], FOG, t);
        ctx.beginPath(); ctx.ellipse(x, y - 2*s, bw*0.85, 6*s, 0, 0, 7); ctx.fill();
        continue;
      }
      [0, 1].forEach(rowi=>{
        const cy = y - hgt*0.30 - rowi*hgt*0.52 + (1-ratio)*4*s;
        const grd = ctx.createLinearGradient(x, cy - 9*s, x, cy + 9*s);
        grd.addColorStop(0, mix([138,124,98], FOG, t));
        grd.addColorStop(0.5, mix([95,84,64], FOG, t));
        grd.addColorStop(1, mix([38,33,24], FOG, t));
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.ellipse(x, cy, bw*0.86, 9*s, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = `rgba(0,0,0,${0.5*(1-t)})`; ctx.lineWidth = Math.max(0.6, 1.2*s);
        ctx.stroke();
      });
    }
    ctx.fillStyle = mix([70,58,36], FOG, t);                 // 가로 통나무
    ctx.fillRect(xl - 6*s, y - hgt*0.86, (xr-xl) + 12*s, 5*s);
    ctx.fillStyle = `rgba(255,232,186,${0.10*(1-t)})`;
    ctx.fillRect(xl - 6*s, y - hgt*0.86, (xr-xl) + 12*s, 1.6*s);

    // 등급별 보강 — 내 참호가 강화되는 방식과 같은 언어를 쓴다
    if(lv >= 2){                                          // 2등급: 앞면 판자
      for(let x = xl; x < xr; x += 46*s){
        ctx.fillStyle = mix([86,68,40], FOG, t);
        ctx.fillRect(x, y - hgt*0.52, 42*s, 13*s);
        ctx.fillStyle = `rgba(255,236,196,${0.10*(1-t)})`;
        ctx.fillRect(x, y - hgt*0.52, 42*s, 3*s);
        ctx.fillStyle = mix([30,24,14], FOG, t);              // 못
        ctx.beginPath(); ctx.arc(x + 5*s, y - hgt*0.45, 1.6*s, 0, 7); ctx.fill();
      }
    }
    if(lv >= 3){                                          // 3등급: 리벳 철판
      for(let x = xl - 4*s; x < xr; x += 62*s){
        const pl = ctx.createLinearGradient(0, y - hgt*0.72, 0, y - hgt*0.1);
        pl.addColorStop(0, mix([116,124,128], FOG, t));
        pl.addColorStop(0.5, mix([74,82,86], FOG, t));
        pl.addColorStop(1, mix([38,42,46], FOG, t));
        ctx.fillStyle = pl;
        ctx.fillRect(x, y - hgt*0.72, 58*s, hgt*0.62);
        ctx.strokeStyle = `rgba(0,0,0,${0.5*(1-t)})`; ctx.lineWidth = Math.max(0.6, 1.2*s);
        ctx.strokeRect(x, y - hgt*0.72, 58*s, hgt*0.62);
        ctx.fillStyle = mix([150,158,162], FOG, t);
        for(let k=0;k<3;k++){
          ctx.beginPath(); ctx.arc(x + 10*s + k*19*s, y - hgt*0.66, 1.8*s, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(x + 10*s + k*19*s, y - hgt*0.16, 1.8*s, 0, 7); ctx.fill();
        }
      }
    }

  }else if(wk.kind === 'wire'){
    // 코일 철조망 — 낮게 깔려 통로를 덮는다.
    // 배경의 좌우 철조망 울타리와 같은 톤이면 설치물로 안 읽히므로 더 밝게 하고
    // 바닥에 그림자를 깔아 "여기 놓인 물건"으로 분리한다.
    ctx.fillStyle = `rgba(0,0,0,${0.34*(1-t)})`;
    ctx.beginPath(); ctx.ellipse((xl+xr)/2, y + 2*s, (xr-xl)/2, 7*s, 0, 0, 7); ctx.fill();
    const a = (0.92 - t*0.5) * (0.4 + ratio*0.6);
    ctx.strokeStyle = `rgba(206,212,198,${a})`;
    ctx.lineWidth = Math.max(0.8, 1.8*s);
    // 등급이 오르면 코일이 겹으로 늘어난다 — 붙잡는 힘이 세진 게 보이도록
    for(let row=0; row<lv; row++){
      const ry = y - 10*s - row*9*s;
      for(let x = xl + (row%2)*11*s; x < xr; x += 22*s){
        const yy = ry + Math.sin(x*0.05 + row)*3*s;
        ctx.beginPath(); ctx.ellipse(x, yy, 15*s, 8*s, 0.2, 0, 7); ctx.stroke();
      }
    }
    ctx.lineWidth = Math.max(0.6, 1.1*s);                    // 가시
    ctx.strokeStyle = `rgba(206,210,196,${a*0.9})`;
    for(let x = xl + 5*s; x < xr; x += 12*s){
      const yy = y - 10*s + Math.sin(x*0.05)*3*s;
      ctx.beginPath();
      ctx.moveTo(x - 3.5*s, yy - 3.5*s); ctx.lineTo(x + 3.5*s, yy + 3.5*s);
      ctx.moveTo(x + 3.5*s, yy - 3.5*s); ctx.lineTo(x - 3.5*s, yy + 3.5*s);
      ctx.stroke();
    }
    ctx.strokeStyle = `rgba(150,152,142,${a})`;              // 말뚝
    ctx.lineWidth = Math.max(1, 2.4*s);
    for(let x = xl; x <= xr; x += 62*s){
      ctx.beginPath(); ctx.moveTo(x, y + 3*s); ctx.lineTo(x, y - 24*s); ctx.stroke();
    }

  }else{
    // 지뢰밭 — 파묻은 흙무덤과 신관 머리. 남은 개수를 눈으로 세게 한다.
    const n = Math.max(0, Math.ceil(wk.hp));
    for(let k=0;k<n;k++){
      const wx = (-1 + (2*(k + 0.5) / Math.max(1, n))) * FUNNEL*0.86;
      const x = projX(wx, d), yy = y - 2*s + ((k%2) ? 4*s : 0);
      ctx.fillStyle = `rgba(0,0,0,${0.4*(1-t)})`;                  // 파낸 자리
      ctx.beginPath(); ctx.ellipse(x, yy + 2*s, 15*s, 5.4*s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = mix([84,72,46], FOG, t);                     // 흙무덤
      ctx.beginPath(); ctx.ellipse(x, yy, 13*s, 4.8*s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = mix([132,118,76], FOG, t);                   // 노출된 상판
      ctx.beginPath(); ctx.ellipse(x, yy - 2.4*s, 6.4*s, 2.8*s, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(20,16,10,${0.6*(1-t)})`; ctx.lineWidth = Math.max(0.6, 1.1*s);
      ctx.stroke();
      const blink = 0.35 + 0.65*Math.abs(Math.sin(g.t*2.4 + k));   // 신관 램프
      ctx.fillStyle = `rgba(236,96,62,${blink*(1-t)})`;
      ctx.beginPath(); ctx.arc(x, yy - 3.4*s, 2*s, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      const lg = ctx.createRadialGradient(x, yy - 3.4*s, 0, x, yy - 3.4*s, 9*s);
      lg.addColorStop(0, `rgba(255,90,50,${blink*0.4*(1-t)})`);
      lg.addColorStop(1, 'rgba(255,90,50,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(x, yy - 3.4*s, 9*s, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // 내구도 게이지 — 저지물만. 지뢰는 위 개수로 이미 보인다.
  if(alpha == null && W2.blocks !== false && ratio < 1){
    const gw = (xr - xl) * 0.5, gx = (xl + xr)/2 - gw/2, gy = y - 46*s;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(gx - 1, gy - 1, gw + 2, 5);
    ctx.fillStyle = ratio > 0.5 ? '#c9a34b' : ratio > 0.25 ? '#d4762e' : C.red;
    ctx.fillRect(gx, gy, gw * ratio, 3);
  }
  if(wk.fx > 0){                                            // 얻어맞은 순간 번쩍
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,170,120,${wk.fx*0.14})`;
    ctx.fillRect(xl - 20*s, y - 52*s, (xr-xl) + 40*s, 60*s);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

/* 지뢰 폭발 */
function drawBooms(){
  g.booms.forEach(b=>{
    const r = (1 - b.life) * 90 * b.s + 8;
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(b.x, b.y - 10*b.s, 2, b.x, b.y - 10*b.s, r);
    gr.addColorStop(0,   `rgba(255,246,208,${b.life})`);
    gr.addColorStop(0.35,`rgba(255,158,54,${b.life*0.6})`);
    gr.addColorStop(1,   'rgba(120,40,10,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(b.x, b.y - 10*b.s, r, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(40,34,28,${b.life*0.5})`;          // 흙먼지
    ctx.beginPath(); ctx.ellipse(b.x, b.y, r*0.8, r*0.3, 0, 0, 7); ctx.fill();
  });
}

function drawZombie(z){
  const b = box(z), T = TYPES[z.type], t = fogT(z.d);
  const cc = zColors(z.type, z.hue, t);
  const body = cc.body, head = cc.head, dark = cc.dark;
  const s = b.s * z.sz, h = b.h, x = b.cx, fy = b.fy;
  const walk = Math.sin(z.ph), walk2 = Math.cos(z.ph);

  /* 화면에서 차지하는 키로 디테일 단계를 나눈다.
     수백 마리가 몰려오면 멀리 있는 놈의 눈·입·림라이트·비틀거림 회전은
     보이지도 않는데 값은 똑같이 나갔다. 특히 회전은 모든 도형을
     축에 어긋나게 래스터화시켜서 제일 비싸다. */
  const FAR = h < 74, NEAR = h > 118;

  ctx.save();
  ctx.translate(x, fy);
  if(!FAR || z.swing > 0.05)                                 // 비틀거림 + 내려찍는 반동
    ctx.rotate(Math.sin(z.ph*0.5) * 0.035 + z.swing * 0.10);

  if(!FAR){                                                  // 그림자
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(0, 0, h*0.22, h*0.05, 0, 0, 7); ctx.fill();
  }

  const legH = h*0.40, torH = h*0.36, headR = h*0.115, bw = h*0.20;

  // 다리
  ctx.strokeStyle = dark; ctx.lineWidth = h*0.075; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-bw*0.30, -legH); ctx.lineTo(-bw*0.30 + walk*h*0.09, 0);
  ctx.moveTo( bw*0.30, -legH); ctx.lineTo( bw*0.30 - walk*h*0.09, 0);
  ctx.stroke();

  /* 몸통 — 위가 밝은 그라디언트로 통을 세우고, 밑단은 찢긴 옷처럼 들쭉날쭉하게.
     그라디언트 객체 생성이 비싸서 가까운 놈에게만 쓴다. 멀리 있는 놈은
     어차피 몇 픽셀이라 단색으로 칠해도 차이가 안 보인다. */
  if(s > 0.62){
    const tg = ctx.createLinearGradient(0, -legH - torH, 0, -legH);
    tg.addColorStop(0, body);
    tg.addColorStop(1, cc.deep);
    ctx.fillStyle = tg;
  }else{
    ctx.fillStyle = body;
  }
  ctx.beginPath();
  ctx.moveTo(-bw*0.62, -legH - torH);
  ctx.lineTo( bw*0.62, -legH - torH);
  if(FAR){                                                   // 밑단 톱니는 가까울 때만
    ctx.lineTo( bw*0.50, -legH + torH*0.08);
    ctx.lineTo(-bw*0.50, -legH + torH*0.08);
  }else{
    ctx.lineTo( bw*0.50, -legH + torH*0.10);
    ctx.lineTo( bw*0.28, -legH - torH*0.04);
    ctx.lineTo( bw*0.02, -legH + torH*0.12);
    ctx.lineTo(-bw*0.26, -legH - torH*0.02);
    ctx.lineTo(-bw*0.50, -legH + torH*0.08);
  }
  ctx.closePath(); ctx.fill();
  if(!FAR){                                                  // 찢긴 옷 얼룩
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(-bw*0.5, -legH - torH*0.45, bw*0.42, torH*0.30);
  }

  // 팔 — 전진 중엔 앞으로 뻗고, 참호를 때릴 땐 위로 들었다 내려찍는다.
  // 양팔을 똑같이 움직이면 허수아비처럼 보이므로 개체마다 좌우를 어긋나게 둔다.
  const asym = z.hue / 26;
  ctx.strokeStyle = head; ctx.lineWidth = h*0.062;
  const sy = -legH - torH*0.86;
  const armY = z.melee ? (h*0.34*z.swing - h*0.24*(1 - z.swing)) : h*0.05 ;
  ctx.beginPath();
  ctx.moveTo(-bw*0.55, sy);
  ctx.lineTo(-bw*(0.95 + asym*0.12), sy + armY*(1 + asym*0.28) + walk2*h*0.03);
  ctx.moveTo( bw*0.55, sy);
  ctx.lineTo( bw*(0.95 - asym*0.12), sy + armY*(1 - asym*0.34) - walk2*h*0.03);
  ctx.stroke();

  // 머리 (히트박스 상단 26%)
  const hy = -legH - torH - headR*0.85;
  ctx.fillStyle = head;
  ctx.beginPath(); ctx.arc(0, hy, headR, 0, 7); ctx.fill();
  if(!FAR){                                                  // 붉은 눈 + 벌어진 입
    ctx.fillStyle = 'rgba(255,60,50,.9)';
    ctx.beginPath();
    ctx.arc(-headR*0.38, hy - headR*0.12, headR*0.20, 0, 7);
    ctx.arc( headR*0.38, hy - headR*0.12, headR*0.20, 0, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(10,8,8,.8)';
    ctx.fillRect(-headR*0.42, hy + headR*0.35, headR*0.84, headR*0.22);
  }else{
    ctx.fillStyle = 'rgba(255,60,50,.75)';                   // 멀면 눈만 한 덩이로
    ctx.fillRect(-headR*0.5, hy - headR*0.3, headR, headR*0.34);
  }

  // 달빛 림라이트 — 광원이 오른쪽 위(달)에 있으니 그쪽 윤곽만 밝게 딴다.
  // 평면 실루엣이 입체로 읽히는 데 이 한 줄이 제일 크게 먹는다.
  if(NEAR){
    ctx.strokeStyle = `rgba(196,212,236,${0.30 * (1 - t)})`;
    ctx.lineWidth = Math.max(0.8, h*0.014);
    ctx.beginPath();
    ctx.arc(0, hy, headR, -Math.PI*0.85, -Math.PI*0.10);
    ctx.moveTo(bw*0.62, -legH - torH);
    ctx.lineTo(bw*0.50, -legH + torH*0.08);
    ctx.stroke();
  }

  /* 피격 플래시 — 예전엔 히트박스 사각형을 통째로 밝혀서, 맞을 때마다 좀비 위에
     흰 상자가 떠올랐다. 몸통과 머리 실루엣만 물들인다. */
  if(z.flash > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,152,138,${z.flash*0.34})`;
    ctx.beginPath();
    ctx.moveTo(-bw*0.62, -legH - torH);
    ctx.lineTo( bw*0.62, -legH - torH);
    ctx.lineTo( bw*0.50, -legH + torH*0.10);
    ctx.lineTo(-bw*0.50, -legH + torH*0.08);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, hy, headR*1.04, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  /* 체력바는 브루트·보스만. 워커와 러너는 한두 발에 터지는데 떼로 몰려오면
     막대 수백 개가 머리 위에 깔려서, 정작 봐야 할 큰 놈이 안 보였다.
     "이건 오래 쏴야 하는 놈이다" 를 알려주는 게 목적이므로 그 놈들에게만 준다. */
  if(z.hp < z.max && (z.type === 'boss' || z.type === 'brute') && b.h > 40){
    const bwid = Math.max(20, b.w*0.9), bx = b.cx - bwid/2, by = b.y - 10;
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(bx - 1, by - 1, bwid + 2, 6);
    ctx.fillStyle = z.type === 'boss' ? '#c94ff0' : '#e0824a';
    ctx.fillRect(bx, by, bwid * (z.hp/z.max), 4);
  }
}

/* 모래주머니 한 개 */
function sandbag(cx, cy, rx, ry, lit, tear){
  const grd = ctx.createLinearGradient(cx, cy - ry, cx, cy + ry);
  grd.addColorStop(0,    lit ? '#8a7c62' : '#6f6450');
  grd.addColorStop(0.48, lit ? '#5f553f' : '#4c4432');
  grd.addColorStop(1,    '#26221a');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2; ctx.stroke();
  // 봉제선
  ctx.strokeStyle = 'rgba(30,24,16,.45)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx - rx*0.74, cy - ry*0.06);
  ctx.quadraticCurveTo(cx, cy + ry*0.34, cx + rx*0.74, cy - ry*0.06);
  ctx.stroke();
  // 윗면 하이라이트
  ctx.fillStyle = 'rgba(255,240,200,.07)';
  ctx.beginPath(); ctx.ellipse(cx - rx*0.15, cy - ry*0.46, rx*0.52, ry*0.26, -0.12, 0, 7); ctx.fill();
  if(tear > 0){                                    // 찢겨서 모래가 새는 자국
    ctx.fillStyle = `rgba(18,14,10,${Math.min(0.55, tear)})`;
    ctx.beginPath(); ctx.ellipse(cx + rx*0.24, cy - ry*0.1, rx*0.24, ry*0.3, 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(150,132,96,${Math.min(0.5, tear*0.8)})`;
    ctx.beginPath(); ctx.ellipse(cx + rx*0.28, cy + ry*0.72, rx*0.3, ry*0.2, 0, 0, 7); ctx.fill();
  }
}

/* 철조망 코일 */
function wireCoil(y){
  ctx.strokeStyle = 'rgba(158,160,150,.62)'; ctx.lineWidth = 2;
  for(let x=-30;x<W+50;x+=48){
    const yy = y + Math.sin(x*0.045)*5;
    ctx.beginPath(); ctx.ellipse(x, yy, 32, 13, 0.22, 0, 7); ctx.stroke();
  }
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(178,180,168,.55)';
  for(let x=6;x<W;x+=24){
    const yy = y + Math.sin(x*0.045)*5;
    ctx.beginPath();
    ctx.moveTo(x-6, yy-6); ctx.lineTo(x+6, yy+6);
    ctx.moveTo(x+6, yy-6); ctx.lineTo(x-6, yy+6);
    ctx.stroke();
  }
}

function drawTrench(){
  const ratio = g ? Math.max(0, g.bar / g.barMax) : 1;    // 내구도 비율
  const hurt  = 1 - ratio;
  const jolt  = g ? g.barFx * 5 : 0;                       // 얻어맞을 때 흔들림

  ctx.save();
  ctx.translate(0, jolt);

  // ① 참호 뒤편 흙벽
  ctx.fillStyle = '#0e0d0a';
  ctx.beginPath(); ctx.moveTo(0, H + 30); ctx.lineTo(0, 600);
  for(let x=0;x<=W;x+=8) ctx.lineTo(x, 600 + Math.sin(x*0.021)*8);
  ctx.lineTo(W, H + 30); ctx.closePath(); ctx.fill();

  // ② 철조망 (모래주머니 뒤로 살짝 보이게)
  wireCoil(596);

  // ③ 뒷줄 모래주머니 — 내구도가 떨어지면 여기서부터 터져나간다
  let i = 0;
  for(let x=-44;x<W+90;x+=90, i++){
    const thr = ((i*7) % 10) / 10;
    const jt  = Math.sin(x*0.7)*4;
    if(hurt > 0.32 + thr*0.62){                    // 파괴 → 흘러내린 모래 더미만
      ctx.fillStyle = 'rgba(78,68,50,.75)';
      ctx.beginPath(); ctx.ellipse(x, 646 + jt, 46, 15, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(16,13,9,.8)';
      ctx.beginPath(); ctx.ellipse(x, 636 + jt, 34, 9, 0, 0, 7); ctx.fill();
      continue;
    }
    const sag = hurt * 11 * thr;
    sandbag(x, 626 + jt + sag, 51, 27 - sag*0.45, true, hurt - 0.15);
  }

  // ④ 가로 통나무 보 — 나뭇결까지
  const beam = ctx.createLinearGradient(0, 652, 0, 684);
  beam.addColorStop(0, '#5c4c2e'); beam.addColorStop(0.42, '#463a22'); beam.addColorStop(1, '#241d11');
  ctx.fillStyle = beam; ctx.fillRect(0, 652, W, 32);
  ctx.strokeStyle = 'rgba(20,15,8,.5)'; ctx.lineWidth = 1.4;
  for(let x=0;x<W;x+=6){
    const yy = 660 + Math.sin(x*0.11)*3.2;
    ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x+6, yy + Math.sin((x+6)*0.11)*0.4); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,230,180,.08)'; ctx.fillRect(0, 652, W, 5);

  // ⑤ 앞줄 모래주머니
  for(let x=0; x<W+90; x+=90){
    sandbag(x, 690 + Math.sin(x*0.6)*4, 55, 29, false, hurt - 0.5);
  }

  // ⑥ 단계별 보강물 — 3회 강화마다 참호 외관이 실제로 달라진다
  const TT = g ? trTier(g.trUps) : 0;
  if(TT >= 1){                                   // 1단계: 앞줄에 판자 덧대기
    for(let x=-10;x<W+40;x+=196){
      ctx.fillStyle = '#4b3d24'; ctx.fillRect(x, 672, 180, 20);
      ctx.fillStyle = 'rgba(255,235,190,.09)'; ctx.fillRect(x, 672, 180, 4);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x, 688, 180, 4);
      ctx.fillStyle = '#241d11';                                    // 못
      ctx.beginPath(); ctx.arc(x+12, 682, 3.5, 0, 7); ctx.arc(x+168, 682, 3.5, 0, 7); ctx.fill();
    }
  }
  if(TT >= 2){                                   // 2단계: 볼트로 박은 철판
    for(let x=0;x<W+30;x+=164){
      const pl = ctx.createLinearGradient(0, 664, 0, 706);
      pl.addColorStop(0, '#6a6f72'); pl.addColorStop(0.5, '#474d50'); pl.addColorStop(1, '#282c2e');
      ctx.fillStyle = pl; ctx.fillRect(x, 664, 156, 44);
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2; ctx.strokeRect(x, 664, 156, 44);
      ctx.fillStyle = '#8b9196';                                    // 리벳
      for(let k=0;k<4;k++){
        ctx.beginPath(); ctx.arc(x+18+k*40, 672, 3.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+18+k*40, 700, 3.5, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x+4, 668, 148, 4);
    }
  }
  if(TT >= 3){                                   // 3단계: 총안구 뚫린 중앙 방탄판
    const sh = ctx.createLinearGradient(0, 606, 0, 672);
    sh.addColorStop(0, '#7d8286'); sh.addColorStop(0.55, '#4d5256'); sh.addColorStop(1, '#2a2e30');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.roundRect(W/2 - 210, 606, 420, 66, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#0c0e0f';                                      // 총안구
    ctx.beginPath(); ctx.roundRect(W/2 - 120, 622, 240, 17, 5); ctx.fill();
    ctx.fillStyle = '#9aa0a5';
    for(let k=0;k<8;k++){ ctx.beginPath(); ctx.arc(W/2 - 190 + k*54, 662, 4, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fillRect(W/2 - 206, 610, 412, 5);
  }

  // ⑦ 세로 지지 기둥 — 전경 프레임
  for(let x=126;x<W;x+=248){
    ctx.fillStyle = '#3a3020'; ctx.fillRect(x - 15, 588, 30, H - 588 + 30);
    ctx.fillStyle = 'rgba(255,235,190,.09)'; ctx.fillRect(x - 15, 588, 9, H - 588 + 30);
    ctx.fillStyle = 'rgba(0,0,0,.4)';        ctx.fillRect(x + 7,  588, 8, H - 588 + 30);
    ctx.fillStyle = '#4e4229';                                       // 기둥 윗단면
    ctx.beginPath(); ctx.ellipse(x, 588, 15, 6, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#2b2318';                                       // 고정 볼트
    ctx.beginPath(); ctx.arc(x, 668, 5, 0, 7); ctx.fill();
  }

  // ⑧ 참호 바닥 + 소품
  ctx.fillStyle = '#0a0906'; ctx.fillRect(0, 706, W, H - 706 + 30);
  ctx.fillStyle = 'rgba(150,120,60,.5)';                             // 발밑에 쌓인 탄피
  for(let k=0;k<70;k++){
    const sx = (k*173) % W, sy = 708 + ((k*57) % 12);
    ctx.fillRect(sx, sy, 7, 3);
  }
  ctx.fillStyle = '#3e3524';                                         // 탄약 상자
  ctx.fillRect(52, 676, 132, 46);
  ctx.fillStyle = 'rgba(255,235,190,.08)'; ctx.fillRect(52, 676, 132, 6);
  ctx.fillStyle = 'rgba(0,0,0,.45)';       ctx.fillRect(52, 700, 132, 5);
  ctx.fillStyle = '#8a7a4e'; type(15, 700, 1.2); ctx.textAlign = 'center';
  ctx.fillText('7.62', 118, 697);

  ctx.restore();

  // 참호가 맞은 순간 붉게 번쩍
  if(g && g.barFx > 0){
    ctx.fillStyle = `rgba(180,40,25,${g.barFx*0.22})`;
    ctx.fillRect(0, 588, W, H - 588);
  }
}

function poly(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
/* ── 총 ────────────────────────────────────────────────────
   로컬 좌표: 원점이 어깨쪽 회전축, -y 가 총구 방향. 총구는 (0,-BARREL) 로
   고정이라 예광탄·화염과 절대 어긋나지 않는다.
   부품을 실제 소총 순서대로 쌓는다 — 개머리판 / 손잡이 / 방아쇠울 / 리시버 /
   탄창 / 핸드가드 / 가스블록 / 총열 / 총구장치 / 가늠쇠.
   반동은 노리쇠와 장전손잡이가 뒤로 왕복하고, 재장전은 탄창이 실제로 빠진다.
   ─────────────────────────────────────────────────────── */
/* 단계별 재질. 참호 바닥이 워낙 어두워서 최하단 값을 너무 낮추면 총이 묻힌다 —
   가장 어두운 톤도 #1e 이상으로 유지한다. */
/* 0 제식(목재+청강) → 1 개조 → 2 본격 → 3 중화기 → 4 최종.
   연사 계열은 황동·주황 쪽으로, 관통 계열은 강청색 쪽으로 갈린다. */
const GUN_MAT_BASE =
  {wood:['#8a6737','#634624','#3a2915'], body:['#6a6154','#4c463b','#2e2924'],
   metal:['#8f867a','#665f56','#3d3833'], grip:'#332714', tint:'#a37c40'};
const GUN_MAT = {
  rate: [
    GUN_MAT_BASE,
    {wood:['#6b5a3c','#4c4029','#2c251a'], body:['#635a4a','#463f33','#292419'],
     metal:['#9d907c','#726858','#443e34'], grip:'#2e2618', tint:'#c08f3c'},
    {wood:['#5e5340','#42392b','#26211a'], body:['#5c5343','#403a2e','#25211a'],
     metal:['#b0a184','#80745e','#4b4335'], grip:'#2a2318', tint:'#d4a03f'},
    {wood:['#4e4636','#373125','#201c15'], body:['#514a3c','#39332a','#211d17'],
     metal:['#c2ae86','#8d7f60','#524936'], grip:'#241f16', tint:'#e0b23f'},
    {wood:['#453e30','#302b21','#1c1913'], body:['#4a4335','#342f26','#1f1b15'],
     metal:['#d8bf8c','#a08f66','#5c5138'], grip:'#201c14', tint:'#f0c94a'},
  ],
  pierce: [
    GUN_MAT_BASE,
    {wood:['#525a5c','#3a4042','#232729'], body:['#565e60','#3d4345','#242829'],
     metal:['#8e989c','#677073','#3c4244'], grip:'#272d2f', tint:'#8fa6ae'},
    {wood:['#48545a','#333d42','#1f272a'], body:['#49545d','#333c43','#1e2226'],
     metal:['#98a1a6','#6c757a','#3d4346'], grip:'#252d31', tint:'#84a0ae'},
    {wood:['#3d4a54','#2b343c','#191f24'], body:['#3f4a55','#2c343d','#191d22'],
     metal:['#9fb0ba','#71808a','#404a52'], grip:'#212930', tint:'#7fb4c8'},
    {wood:['#38424f','#272e38','#171b21'], body:['#3a4350','#292f39','#171b20'],
     metal:['#a8bccc','#788896','#424c56'], grip:'#1e252c', tint:'#a5d4e8'},
  ],
};
/* 세로로 세운 원통 느낌 — 왼쪽 모서리가 밝고 가운데가 몸통색, 오른쪽이 그늘.
   어두운 외곽선을 같이 두른다. 참호 바닥이 총 색과 비슷해서 선이 없으면
   총의 절반이 배경에 묻혀 사라진다. */
function tube(x, y, w, h, cols, r){
  const grd = ctx.createLinearGradient(x, 0, x + w, 0);
  grd.addColorStop(0,    cols[0]);
  grd.addColorStop(0.34, cols[1]);
  grd.addColorStop(1,    cols[2]);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r == null ? 3 : r);
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.6; ctx.stroke();
}
function screw(x, y, r, col){
  ctx.fillStyle = col || '#1a1814';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = Math.max(0.6, r*0.28);
  ctx.beginPath(); ctx.moveTo(x - r*0.6, y); ctx.lineTo(x + r*0.6, y); ctx.stroke();
}

function drawGun(){
  const aim = gunAim();
  const T   = g ? gunTier(g.gunUps) : 0;             // 0~4 단계
  const BR  = g && g.branch ? g.branch : 'rate';     // 계열 미선택이면 기본 도색
  const M   = GUN_MAT[BR][T];
  const isRate = BR === 'rate';
  const rec = g ? g.recoil : 0;
  const rl  = aim.rl;
  // 재장전 앞절반에 탄창이 빠지고 뒤절반에 새 탄창이 올라온다
  const magT   = rl > 0.02 ? Math.min(1, rl*1.5) : 0;
  const bolt   = rec * 24;                           // 노리쇠 후퇴량

  ctx.save();
  ctx.translate(aim.ox, aim.oy);
  ctx.rotate(aim.ang);                               // 총열이 조준점을 향한다
  /* 길이는 BARREL 로 묶여 있으니 단면만 넓힌다 — 세로로 세웠을 때 파이프처럼
     보이던 게 폭 부족 때문이었다. x 만 늘려도 총구는 축(x=0) 위에 그대로 있어
     예광탄·화염 정렬은 영향을 받지 않는다. */
  ctx.scale(1.34, 1);

  /* ① 개머리판 — 어깨에 붙는 쪽. 뺨받침(comb)과 고무 뒤판을 나눠 그린다 */
  ctx.fillStyle = M.wood[1];
  poly([[16,-52],[74,-16],[150,132],[128,150],[54,146],[24,-28]]);
  ctx.fillStyle = M.wood[0];                          // 위쪽 뺨받침 하이라이트
  poly([[16,-52],[46,-34],[110,120],[86,128]]);
  ctx.fillStyle = M.wood[2];                          // 아래 그늘
  poly([[74,-16],[150,132],[128,150],[96,120]]);
  ctx.fillStyle = '#1b1a18';                          // 고무 뒤판
  poly([[128,150],[150,132],[162,152],[140,170]]);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for(let i=0;i<3;i++) ctx.fillRect(134 + i*7, 142, 3, 22);
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2;   // 멜빵 고리
  ctx.beginPath(); ctx.ellipse(96, 84, 7, 4, 0.6, 0, 7); ctx.stroke();

  /* ② 권총 손잡이 + 방아쇠울 */
  ctx.fillStyle = M.grip;
  poly([[4,-26],[44,-10],[62,98],[20,106],[2,40]]);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for(let i=0;i<5;i++){                               // 미끄럼 방지 홈
    ctx.fillRect(12 + i*2, 10 + i*16, 34 - i*2, 4);
  }
  ctx.strokeStyle = M.metal[1]; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();                                    // 방아쇠울
  ctx.moveTo(-2,-16); ctx.quadraticCurveTo(20, 34, 44, 2); ctx.stroke();
  ctx.strokeStyle = M.metal[0]; ctx.lineWidth = 5;    // 방아쇠 — 쏘면 당겨진다
  ctx.beginPath();
  ctx.moveTo(16, -8); ctx.quadraticCurveTo(19 + rec*4, 8, 14 + rec*5, 18);
  ctx.stroke();

  /* ③ 탄창 — 2단계부터 드럼. 재장전 중엔 빠져 내려간다 */
  ctx.save();
  ctx.translate(magT * 26, magT * 96);
  ctx.rotate(magT * 0.42);
  ctx.globalAlpha = magT > 0.86 ? Math.max(0, (1 - magT) / 0.14) : 1;
  if(isRate && T >= 2){                               // 연사 계열 — 드럼탄창
    tube(-46, -4, 92, 92, ['#3a3630','#282520','#161412'], 46);
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 42, 45, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 42, 30, 0.6, 4.2); ctx.stroke();
    screw(0, 42, 6, '#22201b');
    tube(-19, -36, 38, 48, ['#3a3630','#282520','#161412'], 3);
    if(T >= 4){                                       // 회전 다연장 — 급탄 벨트
      ctx.strokeStyle = M.tint; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(30, 20); ctx.quadraticCurveTo(74, 54, 62, 104);
      ctx.stroke();
      ctx.fillStyle = '#2a2620';
      for(let i=0;i<5;i++) ctx.fillRect(40 + i*5, 30 + i*15, 12, 6);
    }
  }else{
    const big = T >= 2 ? 1.35 : 1;                    // 관통 계열 — 대구경 박스탄창
    ctx.fillStyle = M.body[1];
    poly([[-26*big,-36],[16*big,-36],[34*big,92],[-8*big,100]]);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    poly([[-26*big,-36],[-16*big,-36],[-2*big,96],[-8*big,100]]);
    ctx.fillStyle = 'rgba(0,0,0,.4)';                 // 탄 확인창
    for(let i=0;i<3;i++) ctx.fillRect(6*big, -18 + i*30, 16*big, 8);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  /* ④ 리시버 — 총의 몸통. 배출구·장전손잡이가 여기 붙는다 */
  tube(-36, -146, 74, 124, M.body, 6);
  ctx.fillStyle = 'rgba(0,0,0,.45)';                  // 아래 그림자 경계
  ctx.fillRect(-36, -30, 74, 4);
  ctx.fillStyle = M.metal[2];                         // 배출구
  ctx.beginPath(); ctx.roundRect(14, -128, 22, 40, 3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.beginPath(); ctx.roundRect(16, -126 + bolt*0.5, 18, 34, 3); ctx.fill();
  // 노리쇠 덮개 + 장전손잡이 (반동에 맞춰 뒤로 왕복)
  ctx.save();
  ctx.translate(0, bolt);
  tube(-24, -140, 46, 30, [M.metal[0], M.metal[1], M.metal[2]], 3);
  ctx.fillStyle = M.metal[0];
  ctx.beginPath(); ctx.roundRect(-34, -134, 16, 13, 3); ctx.fill();
  screw(-26, -128, 3);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.07)';            // 상단 광
  ctx.fillRect(-30, -146, 10, 122);
  screw(-26, -46, 3.4); screw(30, -46, 3.4);
  if(T >= 3){                                         // 3단계 금장식
    ctx.fillStyle = M.tint;
    ctx.fillRect(-36, -118, 74, 3); ctx.fillRect(-36, -44, 74, 3);
    ctx.globalAlpha = 0.5; ctx.fillRect(-36, -112, 74, 1); ctx.globalAlpha = 1;
  }

  /* ⑤ 핸드가드 — 잡는 부분. 방열 리브와 통풍구 */
  tube(-33, -286, 67, 146, T >= 1 ? M.body : M.wood, 8);
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  for(let i=0;i<5;i++) ctx.fillRect(-24, -276 + i*28, 20, 8);   // 통풍구
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for(let i=0;i<5;i++) ctx.fillRect(10, -276 + i*28, 16, 6);
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(-28, -286, 9, 146);
  ctx.fillStyle = 'rgba(0,0,0,.4)';        ctx.fillRect(26, -286, 8, 146);
  screw(-24, -150, 3); screw(28, -150, 3);

  /* ⑥ 상부 레일 */
  ctx.fillStyle = M.metal[2];
  ctx.beginPath(); ctx.roundRect(-13, -300, 26, 170, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for(let i=0;i<9;i++) ctx.fillRect(-11, -296 + i*18, 22, 3);

  /* ⑦ 가스블록 + 총열. 계열 3단계부터 실루엣이 크게 갈린다 —
        연사는 총열이 여러 개로, 관통은 총열이 굵어지고 양각대가 달린다. */
  if(isRate && T >= 3){                               // 다연장 — 곁 총열
    const pairs = T >= 4 ? [20, 34] : [21];
